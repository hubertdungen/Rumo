          <input class="f-month-amt" type="text" inputmode="decimal" value="${fmt(p.contributed_this_month)}" title="escreve quanto queres pôr aqui este mês; as outras sem cadeado acompanham">
          <b style="color:var(--good);font-weight:800">€</b></span>
        <span class="row" style="gap:3px;align-items:center">
          <input class="f-pct-num" type="text" inputmode="decimal" step="0.1" min="0" max="100" value="${(p.pct*100).toFixed(2)}" style="width:62px;padding:4px 6px;min-height:28px;font-size:12.5px;text-align:right">
          <span class="muted" style="font-size:12px">%</span>
        </span>
      </div>
      <input class="f-pct" type="range" min="0" max="1" step="any" value="${p.pct}" style="width:100%;margin-top:6px">`; }

// Tipo do cofre e «para que serve»: é o que a IA lê para perceber o cofre. Três passos
// numa barra com um indicador que desliza; o ⓘ explica os tipos (rato ou toque).
const POT_LEVELS_UI = [
  {lv: 1, icon: '📌', name: 'Fixo', color: '#8fa3bf', text: 'guardado; não se acrescenta (ou muito raramente) nem se tira. A IA não lhe toca.'},
  {lv: 2, icon: '🔄', name: 'Variável', color: '#5eead4', text: 'dinheiro para se ir gastando (consumíveis, peças, manutenção). O reforço acompanha o que se gasta.'},
  {lv: 3, icon: '🎯', name: 'Objetivo', color: '#f5b942', text: 'juntar até um valor; só se usa numa urgência. Serve de travão às tentações.'},
];
function potKindRow(p){
  const lv = Number(p.level) || 0;
  const cur = POT_LEVELS_UI.find(x => x.lv === lv);
  const tip = POT_LEVELS_UI.map(x => `<div><b style="color:${x.color}">${x.icon} ${x.lv} · ${x.name}</b> — ${x.text}</div>`).join('')
    + '<div><b>🏦 4 · Poupança Geral</b> — acumula e nunca se tira (fora dos cofres).</div>'
    + '<div class="sub" style="margin-top:4px">A IA lê o tipo e o «para que serve» de cada cofre. Carregar outra vez no tipo escolhido tira-o.</div>';
  return `<div class="lvl-wrap">
    <div class="lvl${cur ? '' : ' none'}" role="radiogroup" aria-label="tipo de cofre"
         style="--i:${cur ? lv - 1 : 0};--c:${cur ? cur.color : 'transparent'}">
      ${POT_LEVELS_UI.map(x => `<button type="button" role="radio" aria-checked="${x.lv === lv}" data-lv="${x.lv}"
          class="${x.lv === lv ? 'on' : ''}" title="${x.name}: ${x.text}">${x.icon} ${x.name}</button>`).join('')}
    </div>
    <span class="lvl-info" tabindex="0" role="button" aria-label="o que são os tipos de cofre">ⓘ<span class="lvl-tip" role="tooltip">${tip}</span></span>
  </div>
  <input class="f-purpose" value="${escAttr(p.purpose || '')}" placeholder="para que serve (a IA lê isto)" style="width:100%;margin-top:6px;min-height:30px;padding:4px 8px;font-size:12px">`;
}

function targetModeOn(){ return S.settings.use_target_accumulated_mode !== false; }
function openingRow(p){ return targetModeOn() ? `
      <div class="field" style="margin-top:8px">
        <label>Valor real no fim do mês anterior</label>
        <input class="f-opening" type="text" inputmode="decimal" step="0.01" value="${(p.accumulated - p.contributed_this_month).toFixed(2)}">

function goalRow(p){
  if (p.goal_amount == null || p.goal_amount === '') return '';
  const g = p.goal;
  if (!g) return '';
  const late = g.on_track === false;
  const never = g.months_needed === null;
  let verdict;
  if (g.months_needed === 0) verdict = '<span style="color:var(--good);font-weight:700">objetivo atingido</span>';
  // Um cofre fixo não recebe por definição: sem aviso, só a marca de guardado.
  else if (never && Number(p.level) === 1) verdict = '<span>guardado · fixo</span>';
  else if (never) verdict = '<span style="color:var(--bad)">não recebe nada — nunca lá chega</span>';
  else {
    const when = g.date_needed ? g.date_needed.split('-').reverse().join('/') : '';
    verdict = `${g.months_needed} ${g.months_needed === 1 ? 'mês' : 'meses'} (${when})` +
      (late ? ' <span style="color:var(--bad);font-weight:700">— depois do prazo</span>'
            : (g.on_track === true ? ' <span style="color:var(--good)">— a tempo</span>' : ''));
  }
  return `
    <div class="progress" style="margin-top:8px"><div style="width:${g.pct.toFixed(1)}%;background:${Number(p.level) === 1 ? 'var(--dim)' : (late||never?'var(--gold)':'var(--good)')}"></div></div>

      <span>${eur(g.have)} de ${eur(g.goal)}</span>
      <span>${verdict}</span>
    </div>`;
}

function renderNews(){
  const n = S.news;
  if (n === 'loading' || n === undefined) return '<div class="sub">a procurar notícias…</div>';
  if (!n || !n.length) return '<div class="sub">sem notícias para as tuas posições neste momento.</div>';
  const ago = (ts) => {
    if (!ts) return '';
    const h = Math.floor((Date.now()/1000 - ts) / 3600);

    return `há ${Math.floor(h/24)}d`;

  return n.map(item => `
    <a href="${escAttr(item.link)}" target="_blank" rel="noopener"
       style="display:block;text-decoration:none;color:inherit;padding:9px 0;border-bottom:1px solid var(--line)">

const PROVIDER_NAMES = {anthropic:'Anthropic', openai:'OpenAI', gemini:'Gemini', deepseek:'DeepSeek'};

function providerName(){ return PROVIDER_NAMES[S.settings.ai_provider] || 'Anthropic'; }

// One renderer for both analyses: they differ in wording and endpoint, not in how a
// stored, paid-for answer is drawn.
function adviceHtml(key, emptyText){
  const a = S[key];
  if (a === 'loading' || a === undefined) return '<div class="sub">a carregar a última resposta…</div>';
  if (a === 'asking') return '<div class="sub">a consultar a IA (pode demorar alguns segundos)…</div>';
  if (!a || !a.text) return `<div class="sub">${emptyText}</div>`;
  const provider = PROVIDER_NAMES[a.provider] || a.provider || '';
  const modeName = {user_focused:'segue as minhas %', balanced:'equilibrado', autonomous:'autónomo'}[a.mode] || '';
  // The server stamps unix seconds; Date wants milliseconds, or it reads as 1970.
  const when = a.at ? new Date(a.at * 1000).toLocaleString('pt-PT', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'}) : '';
  const stale = [];
  if (a.provider && S.settings.ai_provider && a.provider !== S.settings.ai_provider) stale.push('mudaste de fornecedor desde então');
  if (a.mode && S.settings.ai_advice_mode && a.mode !== S.settings.ai_advice_mode) stale.push('mudaste o modo desde então');
  return `
    <div class="row small muted" style="justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px">
      <span>Pedida a ${when}${provider ? ' · ' + provider : ''}${modeName ? ' · ' + modeName : ''}${a.budget != null ? ' · orçamento ' + eur(a.budget) : ''}</span>
      ${stale.length ? `<span style="color:var(--gold)">${stale.join(' e ')}</span>` : ''}
    </div>
    <div class="card md" style="background:var(--panel2)">${renderMarkdown(a.text)}</div>`;
}

// Fetch-once-then-paint, shared by both cards.
function loadStoredAdvice(key, path, boxId, paint){
  if (S[key] !== undefined) return;
  S[key] = 'loading';
  api('GET', path)
    .then(res => { S[key] = res.advice || null; })
    .catch(() => { S[key] = null; })
    .finally(() => { const b = $('#' + boxId); if (b) b.innerHTML = paint(); });
}

// The ask button, wired the same way in both places: confirm before spending, keep the
// previous answer if the call fails, and stay disabled while one is in flight.
function wireAskButton({btnId, boxId, key, path, confirmText, paint, label, labelAgain}){
  const btn = $('#' + btnId);
  if (!btn) return;
  if (S[key] === 'asking') return;  // the template already drew it disabled
  btn.onclick = async () => {
    if (S[key] && S[key].text && !confirm(confirmText)) return;
    const previous = S[key];
    btn.disabled = true; btn.textContent = 'a pensar…';
    S[key] = 'asking';
    const repaint = () => { const b = $('#' + boxId); if (b) b.innerHTML = paint(); };
    repaint();
    try {
      const res = await api('POST', path);
      S[key] = res.advice;
    } catch (e) {
      S[key] = previous;  // a failed call must not cost the previous answer
    } finally {
      repaint();
      btn.disabled = false;
      btn.textContent = (S[key] && S[key].text) ? labelAgain : label;
    }
  };
}

function wireInvestTab(m){
  const reload = () => reloadAfterPotEdit(m);
  wirePotCards($('#tab-invest'), reload);
  wireRebalance('inv', m);

  const addInv = $('#btnAddInv');
  if (addInv) addInv.onclick = async () => {
    const name = prompt('Nome da nova categoria de investimento'); if (!name) return;
    await api('POST', '/api/investments', {name, pct:0});
    await reload();
  };
  wireDragReorder($('#invGrid'), '.potcard[data-kind=inv]', 'investments', reload);
  wireSnapToggle('btnSnapInv');
  const sortInv = $('#btnSortInv');
  if (sortInv) sortInv.onclick = () => sortAlphabetically('investments', m.investimentos, reload);

  const refreshBtn = $('#btnRefreshPrices');
  if (refreshBtn) refreshBtn.onclick = async () => {
    refreshBtn.disabled = true; refreshBtn.textContent = 'a atualizar…';
    try { await refreshPrices({force: true}); }
    finally {
      const btn = $('#btnRefreshPrices');
      if (btn) { btn.disabled = false; btn.textContent = '↻ atualizar'; }
    }
  };

  $$('.f-perf-range', $('#tab-invest')).forEach(btn => btn.onclick = () => {
    S.perfRange = btn.dataset.range;
    renderInvestTab(); renderDashboard();
  });

  const mkt = $('#btnRefreshMarket');
  if (mkt) mkt.onclick = () => { S.market = undefined; loadMarket(true); };
  const nws = $('#btnRefreshNews');
  if (nws) nws.onclick = () => { S.news = undefined; loadNews(true); };

  loadPerf();
  loadMarket();
  loadNews();
  loadAdvice();
  wireHoldings(m);
  wireInvestmentAdvice();
}

// Each of these fetches once and then paints in place, so switching tabs or
// re-rendering after an edit doesn't fire another round of network calls.
function loadPerf(){
  if (!S.holdings.length || S.perf[S.perfRange] !== undefined) return;
  const range = S.perfRange;
  S.perf[range] = 'loading';
  api('GET', `/api/investments/performance?range=${range}`)
    .then(res => { S.perf[range] = res; renderInvestTab(); renderDashboard(); })
    .catch(() => { S.perf[range] = {labels: [], values: []}; renderInvestTab(); renderDashboard(); });
}

function loadAdvice(){
  loadStoredAdvice('advice', '/api/investment-advice', 'adviceResult', investAdviceHtml);
}

function loadMarket(force){
  if (S.market !== undefined && !force) return;
  S.market = 'loading';
  const box = $('#marketBox'); if (box) box.innerHTML = renderMarketOverview();
  api('GET', '/api/market/overview')
    .then(res => { S.market = res.benchmarks || []; })
    .catch(() => { S.market = []; })
    .finally(() => { const b = $('#marketBox'); if (b) b.innerHTML = renderMarketOverview(); });
}

function loadNews(force){
  if (S.news !== undefined && !force) return;
  S.news = 'loading';
  const box = $('#newsBox'); if (box) box.innerHTML = renderNews();
  api('GET', '/api/market/news')
    .then(res => { S.news = res.news || []; })
    .catch(() => { S.news = []; })
    .finally(() => { const b = $('#newsBox'); if (b) b.innerHTML = renderNews(); });
}

function renderHoldingsList(m){
  const byInv = {};
  S.holdings.forEach(h => (byInv[h.investment_id] = byInv[h.investment_id]||[]).push(h));

  let totalValue = 0, totalCost = 0, quotedValue = 0;
  const groups = m.investimentos.map(inv => {
    const items = byInv[inv.id] || [];
    const rows = items.map(h => {
      const isManual = h.manual_value !== null && h.manual_value !== undefined;
      if (isManual) {
        totalValue += h.current_value || 0;
        return `
        <div class="item-row" data-id="${h.id}" style="grid-template-columns:1fr 110px 90px 34px">
          <span>${escAttr(h.name || h.ticker || 'posição')} <span class="muted small">(valor manual)</span></span>
          <input class="f-h-manual" type="text" inputmode="decimal" value="${fmt(h.manual_value)}" title="valor atual -- aceita contas, ex.: 325,35-49,14" style="min-height:32px;font-size:12.5px">
          <span class="small muted">sem histórico</span>
          <button class="ghost icon-btn f-h-del">✕</button>
        </div>`;
      }
      const hasPrice = h.price_info && h.price_info.ok;
      if (hasPrice) { totalValue += h.current_value; quotedValue += h.current_value; totalCost += h.cost_basis; }
      const qtyInfo = (hasPrice
        ? `${eur(h.current_value)} · investido ${eur(h.cost_basis)}`
        : 'sem cotação') + ` <button class="linklike f-h-edit" title="editar quantidade e quanto investiste">✎</button>`;
      return `
      <div class="item-row" data-id="${h.id}" style="grid-template-columns:1fr 100px 90px 90px 34px">
        <span>${escAttr(h.ticker)}${h.name?` <span class="muted small">${escAttr(h.name)}</span>`:''}<br><span class="muted small">${qtyInfo}</span></span>
        <input class="f-h-qty" type="text" inputmode="decimal" value="${qtyStr(h.quantity)}" title="quantidade que tens -- copia da Revolut, aceita contas" placeholder="quantidade" style="min-height:32px;font-size:12.5px">
        <span class="small" title="${escAttr(hasPrice ? (h.price_info.name || '') : ((h.price_info && h.price_info.error) || ''))}">${hasPrice ? eur(h.price_info.price_eur) : (h.price_info ? `<span style="color:var(--bad)">erro ⓘ</span>` : '—')}${hasPrice && h.price_info.currency !== CURRENCY ? `<br><span class="muted small">${fmt(h.price_info.price)} ${escAttr(h.price_info.currency)}</span>` : ''}</span>
        <span class="small" style="font-weight:700;color:${hasPrice && h.gain_loss>=0 ? 'var(--good)' : hasPrice ? 'var(--bad)' : 'var(--dim)'}">${hasPrice ? eur(h.gain_loss) + (h.gain_loss_pct==null ? '' : ' ('+h.gain_loss_pct.toFixed(1)+'%)') : '—'}</span>
        <button class="ghost icon-btn f-h-del">✕</button>
      </div>`;
    }).join('');
    return `
      <div class="cat-group">
        <div class="cat-head"><span class="cat-title">${emoBtn('inv', inv.name, '📊')}<span>${escAttr(inv.name)}</span></span><button class="ghost small f-h-add" data-inv="${inv.id}">+ posição</button></div>
        ${rows || '<div class="sub" style="padding:6px 8px">sem posições nesta categoria</div>'}
      </div>`;
  }).join('');

  const delta = quotedValue - totalCost;
  const manualValue = totalValue - quotedValue;
  const summary = totalValue > 0 ? `
    <div class="row" style="margin-top:10px;gap:20px">
      <span class="small muted">Valor atual: <b>${eur(totalValue)}</b></span>
      ${totalCost > 0 ? `<span class="small muted">Custo das posições com cotação: <b>${eur(totalCost)}</b></span>
      <span class="small" style="font-weight:700;color:${delta>=0?'var(--good)':'var(--bad)'}" title="só conta as posições com cotação">${delta>=0?'▲':'▼'} ${eur(Math.abs(delta))} (${(totalCost ? delta/totalCost*100 : 0).toFixed(1)}%)</span>` : ''}
      ${manualValue > 0 ? `<span class="small muted">dos quais ${eur(manualValue)} em valores manuais, sem ganho/perda calculável</span>` : ''}
    </div>` : '';

  return groups + summary;
}

async function reloadAfterPotEdit(m){
  await refreshPotsInvest();
  const fresh = await refreshMonth(m.id);
  S.months[S.currentIdx] = fresh;
  renderPotsTab(); renderInvestTab(); renderDashboard();
}

function wirePotCards(scope, reload){
  const targetModeActive = targetModeOn();
  $$('.potcard', scope).forEach(card => {
    const id = card.dataset.id, kind = card.dataset.kind;
    const endpoint = kind === 'pot' ? '/api/pots/' : '/api/investments/';
    const patchOne = debounce(async (fields) => { await api('PATCH', endpoint+id, fields); await reload(); }, 350);
    card.querySelector('.f-name').onchange = e => patchOne({name: e.target.value});
    /* Escrever o valor do mês: esta fica com a % que o dá, as outras sem cadeado
       repartem o resto na proporção que já tinham (redondas, com «0,50 € certos»),
       e as trancadas não mexem. */
    const amt = card.querySelector('.f-month-amt');
    if (amt) amt.onchange = async e => {
      const m = curMonth();
      if (!m) return;
      const list = (kind === 'pot' ? m.pots : m.investimentos).filter(x => x.active);
      const base = m.poupanca_total * (kind === 'pot' ? m.split_cofres : m.split_investimentos);
      if (!(base > 0)) { toast('Este mês não há dinheiro para distribuir aqui.', true); await reload(); return; }
      const others = list.filter(x => String(x.id) !== String(id));
      const free = others.filter(x => !x.ai_locked);
      const lockedSum = others.filter(x => x.ai_locked).reduce((a, x) => a + x.pct, 0);
      const max = base * Math.max(0, 1 - lockedSum);
      let want = Math.max(0, toNum(e.target.value) || 0);
      if (want > max + 0.004){ want = max; toast(`O máximo este mês é ${eur(max)}.`); }
      const mine = want / base;
      const room = Math.max(0, 1 - mine - lockedSum);
      const freeSum = free.reduce((a, x) => a + x.pct, 0);
      const updates = [[id, mine]];
      free.forEach(x => updates.push([x.id, snapPct(freeSum > 0 ? x.pct / freeSum * room : room / free.length, base)]));
      try {
        for (const [cid, pct] of updates) await api('PATCH', endpoint + cid, {pct: Math.round(pct * 1e6) / 1e6});
      } catch (err) { toast(err.message, true); }
      await reload();
    };
    // Escolher um tipo; carregar outra vez no escolhido tira-o.
    $$('.lvl button', card).forEach(b => b.onclick = async () => {
      const lv = Number(b.dataset.lv), now = b.classList.contains('on');
      const bar = b.parentElement, c = POT_LEVELS_UI.find(x => x.lv === lv);
      bar.style.setProperty('--i', lv - 1); bar.style.setProperty('--c', c.color); bar.classList.toggle('none', now);
      await api('PATCH', endpoint+id, {level: now ? 0 : lv});
      await reload();
    });
    const purpose = card.querySelector('.f-purpose');
    if (purpose) purpose.onchange = e => api('PATCH', endpoint+id, {purpose: e.target.value.trim()}).catch(err => toast(err.message, true));
    const lock = card.querySelector('.f-lock');
    if (lock) lock.onclick = async () => {
      await api('PATCH', endpoint+id, {ai_locked: card.dataset.locked !== '1'});
      await reload();
    };
    const slider = card.querySelector('.f-pct');
    const numInput = card.querySelector('.f-pct-num');
    slider.oninput = e => {
      const v = toNum(e.target.value);
      numInput.value = (v*100).toFixed(1);
      patchOne({pct: v});
    };
    numInput.oninput = e => {
      const v = Math.max(0, Math.min(100, toNum(e.target.value) || 0)) / 100;
      slider.value = v;
      patchOne({pct: v});
    };
    const snapCard = from => {
      const m = curMonth();
      if (!m || !snapOn()) return;
      const base = m.poupanca_total * (kind === 'pot' ? m.split_cofres : m.split_investimentos);
      const v = snapPct(Math.max(0, Math.min(1, from)), base);
      slider.value = v;
      numInput.value = (v*100).toFixed(2);
      patchOne({pct: v});
    };
    slider.onchange = e => snapCard(toNum(e.target.value));
    numInput.onchange = e => snapCard((toNum(e.target.value) || 0) / 100);
    card.querySelector('.f-opening').oninput = e => {
      const field = targetModeActive ? 'target_accumulated' : 'opening_balance';
      patchOne({[field]: toNum(e.target.value)||0});
    };
    const goalAmount = card.querySelector('.f-goal-amount');
    // onchange, not oninput: the field takes arithmetic, and half an expression is not
    // a goal. An emptied field clears the goal rather than setting it to zero.
    if (goalAmount) goalAmount.onchange = e => {
      const raw = e.target.value.trim();
      patchOne({goal_amount: raw === '' ? null : toNum(raw)});
    };
    const goalDate = card.querySelector('.f-goal-date');
    if (goalDate) goalDate.onchange = e => patchOne({goal_date: e.target.value || null});
    card.querySelector('.f-del').onclick = async () => {
      if (!confirm('Remover este cofre/categoria? O histórico acumulado mantém-se.')) return;
      await api('DELETE', endpoint+id);
      await reload();
    };
  });
}

function wirePotsTab(m){
  const patchMonth = debounce(async (fields) => {
    const updated = await api('PATCH', `/api/months/${m.id}`, fields);
    Object.assign(m, updated.month);
    renderPotsTab(); renderInvestTab(); renderDashboard();
  }, 300);

  const SPLIT_KEYS = {geral: 'split_geral', cofres: 'split_cofres', investimentos: 'split_investimentos'};
  const pctTxt = v => (v * 100).toFixed(1).replace('.', ',') + '%';
  const onSplitChange = (key) => (e) => {
    let val = Math.max(0, Math.min(1, (toNum(e.target.value) || 0) / 100));
    const auto = S.settings.auto_balance_geral !== false;
    const autoField = SPLIT_KEYS[S.settings.auto_balance_target || 'geral'];
    const fields = {[key]: val};
    if (auto && key !== autoField) {
      // O campo automático fica com o que falta; se o que se escreveu já não cabe, ajusta-se ao máximo possível.
      const fixed = Object.values(SPLIT_KEYS).filter(k => k !== key && k !== autoField).reduce((a, k) => a + (m[k] || 0), 0);
      const max = Math.max(0, 1 - fixed);
      if (val > max + 0.0005) {
        val = max; fields[key] = val; e.target.value = (val * 100).toFixed(1);
        toast(`Ajustado ao máximo possível: ${pctTxt(max)}. Os outros já ocupam ${pctTxt(fixed)}.`, true);
      }
      fields[autoField] = Math.max(0, 1 - val - fixed);
    } else {
      const total = Object.values(SPLIT_KEYS).reduce((a, k) => a + (k === key ? val : (m[k] || 0)), 0);
      if (total > 1.0005) toast(`A divisão soma ${pctTxt(total)}: passa dos 100%.`, true);
    }
    patchMonth(fields);
  };
  $$('.stiles .v.editable', $('#tab-pots')).forEach(v => onEditGesture(v, () => {
    if (v.querySelector('input')) return;
    const key = SPLIT_KEYS[v.dataset.edit], base = m.poupanca_total;
    const before = v.innerHTML;
    v.innerHTML = `<input type="text" inputmode="decimal" value="${(base * (m[key] || 0)).toFixed(2)}" aria-label="valor">`;
    const inp = v.querySelector('input'); inp.focus(); inp.select();
    let done = false;
    const finish = ok => {
      if (done) return; done = true;
      if (!ok || !(base > 0)) { v.innerHTML = before; if (ok) toast('Este mês não há poupança para dividir.', true); return; }
      const val = toNum(inp.value);
      if (isNaN(val)) { v.innerHTML = before; return; }
      onSplitChange(key)({target: {value: String(val / base * 100)}});
    };
    inp.onkeydown = e => { if (e.key === 'Enter') finish(true); else if (e.key === 'Escape') finish(false); };
    inp.onblur = () => finish(true);
  }));
  $('#f-split-geral').oninput = onSplitChange('split_geral');
  $('#f-split-cofres').oninput = onSplitChange('split_cofres');
  $('#f-split-inv').oninput = onSplitChange('split_investimentos');
  // Ao sair da caixa, com «0,50 € certos», a % acerta-se sobre a poupança do mês.
  ['#f-split-geral', '#f-split-cofres', '#f-split-inv'].forEach(sel => {
    const input = $(sel);
    if (input) input.onchange = e => {
      if (!snapOn()) return;
      const v = snapPct((toNum(e.target.value) || 0) / 100, m.poupanca_total);
      e.target.value = (v*100).toFixed(2);
      onSplitChange({'#f-split-geral': 'split_geral', '#f-split-cofres': 'split_cofres', '#f-split-inv': 'split_investimentos'}[sel])({target: e.target});
    };
  });
  wireSnapToggle('btnSnapPots');

  const patchGeralOpening = debounce(async (val) => {
    const field = targetModeOn() ? 'geral_target_accumulated' : 'geral_opening_balance';
    await api('PATCH', '/api/settings', {[field]: val});
    await reloadAfterPotEdit(m);
  }, 500);
  $('#f-geral-opening').oninput = e => patchGeralOpening(toNum(e.target.value)||0);

  const reload = () => reloadAfterPotEdit(m);
  wirePotCards($('#tab-pots'), reload);
  wireRebalance('pot', m);

  const addPot = $('#btnAddPot');
  if (addPot) addPot.onclick = async () => {
    const name = prompt('Nome do novo cofre'); if (!name) return;
    await api('POST', '/api/pots', {name, pct:0});
    await reload();
  };

  wireDragReorder($('#potsGrid'), '.potcard[data-kind=pot]', 'pots', reload);
  const sortPots = $('#btnSortPots');
  if (sortPots) sortPots.onclick = () => sortAlphabetically('pots', m.pots, reload);

  const go = $('#btnGoInvest');
  if (go) go.onclick = () => showTab('invest');

  const prio = $('#f-savings-priorities');
  if (prio) prio.oninput = debounce(async (e) => {
    await api('PATCH', '/api/settings', {savings_priorities: e.target.value});
    S.settings.savings_priorities = e.target.value;
  }, 600);

  loadStoredAdvice('savingsAdvice', '/api/savings-advice', 'savingsAdviceResult', savingsAdviceHtml);
  wireAskButton({
    btnId: 'btnAskSavings', boxId: 'savingsAdviceResult', key: 'savingsAdvice',
    path: '/api/savings-advice', paint: savingsAdviceHtml,
    label: 'Pedir análise', labelAgain: 'Pedir nova análise',
    confirmText: 'Isto substitui a análise guardada e gasta uma chamada à IA. Continuar?',
  });
}

// Asset picker: a dropdown seeded with what Revolut actually offers for this kind of
// category, backed by live Yahoo search for everything else. The user types the euro
// value they hold and the server back-solves the quantity from today's price.
async function openHoldingPicker(invId, invName, onDone){
  let cat;
  try { cat = await marketCatalog(); } catch(e){ return; }
  const kind = (cat.kinds || {})[String(invId)] || 'equity';
  const kindName = {commodity:'bens e commodities', crypto:'criptomoedas', equity:'ações e ETFs', none:''}[kind];
  const options = (cat.catalog || {})[kind] || [];
  const startManual = kind === 'none';

  const M = openModal(`
    <h2 style="margin:0 0 4px;font-size:16px">Nova posição — ${escAttr(invName)}</h2>
    <div class="sub">${startManual
      ? 'Esta categoria não tem cotação de mercado — regista só o valor atual.'
      : 'Escolhe o ativo e diz quanto tens lá em euros. A quantidade é calculada ao preço de hoje.'}</div>
    <div class="row" style="margin:12px 0 10px;gap:6px">
      <button class="small mk-mode${startManual?'':' primary'}" data-mode="quote">Com cotação</button>
      <button class="small mk-mode${startManual?' primary':''}" data-mode="manual">Valor manual</button>
    </div>
    <div id="mk-quote"${startManual?' style="display:none"':''}>
      <div class="field">
        <label>Ativo — ${escAttr(kindName || 'mercado')}</label>
        <input id="mk-search" autocomplete="off" placeholder="escreve para procurar (ex.: ouro, bitcoin, VWCE)">
      </div>
      <div class="picker" id="mk-list"></div>
    </div>
    <div id="mk-manual"${startManual?'':' style="display:none"'}>
      <div class="field"><label>Nome / descrição</label>
        <input id="mk-name" placeholder="ex.: Bot Revolut, conta Crypto.com"></div>
    </div>
    <div id="mk-byqty" style="margin-top:12px"${startManual?' hidden':''}>
      <div class="row" style="gap:6px;margin-bottom:8px">
        <button class="small mk-input primary" data-input="qty">Sei a quantidade</button>
        <button class="small mk-input" data-input="value">Sei o valor</button>
      </div>
      <div class="field" id="mk-qty-field">
        <label>Quantidade que tens — copia da Revolut</label>
        <input id="mk-qty" type="text" inputmode="decimal" placeholder="0,08062276">
      </div>
    </div>
    <div class="field" id="mk-value-field" style="margin-top:12px"${startManual?'':' hidden'}>
      <label>Valor atual</label>
      <div class="money">
        <input id="mk-value" type="text" inputmode="decimal" placeholder="323,14">
        <select id="mk-value-cur">${curOptions()}</select>
      </div>
    </div>
    <div class="field" id="mk-cost-field" style="margin-top:10px"${startManual?' hidden':''}>
      <label>Quanto investiste ao todo (opcional — aceita contas, ex.: 325,35-49,14)</label>
      <div class="money">
        <input id="mk-cost" type="text" inputmode="decimal" placeholder="deixa vazio para contar a partir de hoje">
        <select id="mk-cost-cur">${curOptions()}</select>
      </div>
    </div>
    <div id="mk-preview" class="sub" style="margin-top:8px;min-height:17px"></div>
    <div class="row" style="margin-top:16px;justify-content:flex-end">
      <button class="small" id="mk-cancel">Cancelar</button>
      <button class="primary small" id="mk-save">Guardar</button>
    </div>
  `);

  let mode = startManual ? 'manual' : 'quote';
  let inputBy = 'qty';
  let chosen = null, quote = null;

  const renderList = (items, heading) => {
    M.$('#mk-list').innerHTML = items.length
      ? `<div class="picker-group">${escAttr(heading)}</div>` + items.map(o => `
          <div class="picker-opt${chosen && chosen.symbol===o.symbol?' sel':''}" data-sym="${escAttr(o.symbol)}">
            <span><span class="nm">${escAttr(o.label)}</span><br><span class="ht">${escAttr(o.hint||'')}</span></span>
            <span class="sym">${escAttr(o.symbol)}</span>
          </div>`).join('')
      : '<div class="picker-group">sem resultados</div>';
    M.el.querySelectorAll('.picker-opt[data-sym]').forEach(el => el.onclick = () => pick(el.dataset.sym));
  };

  const preview = () => {
    const box = M.$('#mk-preview');
    if (mode === 'manual'){ box.textContent = ''; return; }
    if (!chosen){ box.textContent = 'Escolhe um ativo na lista acima.'; return; }
    if (!quote){ box.textContent = `${chosen.symbol} — a obter cotação…`; return; }
    if (!quote.ok){ box.innerHTML = `<span style="color:var(--bad)">${escAttr(quote.error || 'sem cotação')}</span>`; return; }
    const native = (quote.currency && quote.currency !== CURRENCY)
      ? ` (${fmt(quote.price)} ${quote.currency})` : '';
    let derived = '';
    if (quote.price_eur){
      if (inputBy === 'qty'){
        const q = toNum(M.$('#mk-qty').value);
        if (q) derived = ` → ${qtyStr(q)} un. valem ${eur(q * quote.price_eur)}`;
      } else {
        const val = toEur(M.$('#mk-value').value, M.$('#mk-value-cur').value);
        if (val === null) derived = ' → a obter o câmbio…';
        else if (val) derived = ` → ${eur(val)} dão ${qtyStr(val / quote.price_eur)} unidades`;
      }
    }
    box.textContent = `${quote.name}: ${eur(quote.price_eur)} por unidade${native}${derived}`;
  };

  const pick = async (symbol) => {
    chosen = {symbol}; quote = null;
    M.el.querySelectorAll('.picker-opt').forEach(el => el.classList.toggle('sel', el.dataset.sym === symbol));
    preview();
    try {
      const res = await api('GET', `/api/market/quote?ticker=${encodeURIComponent(symbol)}`);
      if (chosen && chosen.symbol === symbol){ quote = res.quote; preview(); }
    } catch(e){ /* o api() já avisou */ }
  };

  const runSearch = debounce(async (q) => {
    if (!q){ renderList(options, kindName || 'sugestões'); return; }
    const needle = q.toLowerCase();
    const local = options.filter(o => (o.label + ' ' + o.symbol).toLowerCase().includes(needle));
    let remote = [];
    try { remote = (await api('GET', `/api/market/search?q=${encodeURIComponent(q)}`)).results || []; } catch(e){}
    const seen = new Set(local.map(o => o.symbol));
    renderList(local.concat(remote.filter(o => !seen.has(o.symbol))), `resultados para "${q}"`);
  }, 320);

  renderList(options, kindName || 'sugestões');
  preview();

  M.$('#mk-search').oninput = e => runSearch(e.target.value.trim());
  M.$('#mk-value').oninput = preview;
  M.$('#mk-value-cur').onchange = async (e) => { await loadFxRate(e.target.value); preview(); };
  M.$('#mk-cost-cur').onchange = async (e) => { await loadFxRate(e.target.value); };
  M.$('#mk-qty').oninput = preview;
  M.el.querySelectorAll('.mk-input').forEach(b => b.onclick = () => {
    inputBy = b.dataset.input;
    M.el.querySelectorAll('.mk-input').forEach(x => x.classList.toggle('primary', x.dataset.input === inputBy));
    M.$('#mk-qty-field').hidden = inputBy !== 'qty';
    M.$('#mk-value-field').hidden = inputBy !== 'value';
    preview();
  });
  M.el.querySelectorAll('.mk-mode').forEach(b => b.onclick = () => {
    mode = b.dataset.mode;
    M.el.querySelectorAll('.mk-mode').forEach(x => x.classList.toggle('primary', x.dataset.mode === mode));
    M.$('#mk-quote').style.display = mode === 'quote' ? '' : 'none';
    M.$('#mk-manual').style.display = mode === 'manual' ? '' : 'none';
    M.$('#mk-byqty').hidden = mode === 'manual';
    M.$('#mk-cost-field').hidden = mode === 'manual';
    M.$('#mk-qty-field').hidden = mode === 'manual' || inputBy !== 'qty';
    M.$('#mk-value-field').hidden = mode === 'quote' && inputBy !== 'value';
    preview();
  });

  M.$('#mk-cancel').onclick = M.close;
  M.$('#mk-save').onclick = async () => {
    const btn = M.$('#mk-save');
    let body;
    if (mode === 'manual'){
      const name = M.$('#mk-name').value.trim();
      const value = toNum(M.$('#mk-value').value);
      if (!name){ toast('Dá um nome a esta posição.', true); return; }
      if (!value){ toast('Indica o valor atual em euros.', true); return; }
      body = {investment_id: invId, name, manual_value: value};
    } else {
      if (!chosen){ toast('Escolhe um ativo na lista.', true); return; }
      const total_cost = toNum(M.$('#mk-cost').value) || undefined;
      const total_cost_currency = total_cost ? M.$('#mk-cost-cur').value : undefined;
      if (inputBy === 'qty'){
        const qty = toNum(M.$('#mk-qty').value);
        if (!qty){ toast('Indica a quantidade que tens.', true); return; }
        body = {investment_id: invId, ticker: chosen.symbol, quantity: qty, total_cost, total_cost_currency};
      } else {
        const value = toNum(M.$('#mk-value').value);
        if (!value){ toast('Indica o valor que lá tens.', true); return; }
        body = {investment_id: invId, ticker: chosen.symbol, current_value: value,
                current_value_currency: M.$('#mk-value-cur').value, total_cost, total_cost_currency};
      }
    }
    btn.disabled = true; btn.textContent = 'a guardar…';
    try {
      await api('POST', '/api/holdings', body);
      M.close();
      await onDone();
    } catch(e){
      btn.disabled = false; btn.textContent = 'Guardar';
    }
  };
}

// Editing an existing position: the quantity changes whenever the broker's does, and
// what you originally spent is something you often only dig up later -- neither
// should mean deleting the row and starting over.
function openHoldingEditor(h, onDone){
  const priced = h.price_info && h.price_info.ok;
  const costBasis = (h.cost_basis != null) ? h.cost_basis : (h.avg_cost || 0) * (h.quantity || 0);
  const M = openModal(`
    <h2 style="margin:0 0 4px;font-size:16px">${escAttr(h.ticker || h.name || 'posição')}</h2>
    <div class="sub">${escAttr(h.name && h.ticker ? h.name : '')}</div>
    <div class="field" style="margin-top:12px">
      <label>Quantidade que tens</label>
      <input id="he-qty" type="text" inputmode="decimal" value="${qtyStr(h.quantity)}">
    </div>
    <div class="field" style="margin-top:10px">
      <label>Quanto investiste ao todo (aceita contas, ex.: 325,35-49,14)</label>
      <div class="money">
        <input id="he-cost" type="text" inputmode="decimal" value="${costBasis ? fmt(costBasis) : ''}" placeholder="deixa vazio para contar a partir de hoje">
        <select id="he-cost-cur">${curOptions()}</select>
      </div>
    </div>
    <div id="he-preview" class="sub" style="margin-top:8px;min-height:17px"></div>
    <div class="row" style="margin-top:16px;justify-content:flex-end">
      <button class="small" id="he-cancel">Cancelar</button>
      <button class="primary small" id="he-save">Guardar</button>
    </div>
  `);

  const preview = () => {
    const box = M.$('#he-preview');
    if (!priced){ box.textContent = 'Sem cotação de momento — o valor atual não pode ser calculado.'; return; }
    const qty = toNum(M.$('#he-qty').value);
    const cost = toEur(M.$('#he-cost').value, M.$('#he-cost-cur').value);
    if (cost === null){ box.textContent = 'A obter o câmbio…'; return; }
    const value = qty * h.price_info.price_eur;
    const delta = cost ? value - cost : null;
    box.textContent = `${qtyStr(qty)} un. a ${eur(h.price_info.price_eur)} = ${eur(value)}`
      + (delta === null ? ' · sem custo indicado, o ganho conta a partir de hoje'
                        : ` · ${delta >= 0 ? 'ganho' : 'perda'} de ${eur(Math.abs(delta))}`);
  };

  preview();
  M.$('#he-qty').oninput = preview;
  M.$('#he-cost').oninput = preview;
  M.$('#he-cost-cur').onchange = async (e) => { await loadFxRate(e.target.value); preview(); };
  M.$('#he-cancel').onclick = M.close;
  M.$('#he-save').onclick = async () => {
    const btn = M.$('#he-save');
    const quantity = toNum(M.$('#he-qty').value);
    if (!quantity){ toast('Indica a quantidade que tens.', true); return; }
    const total_cost = toNum(M.$('#he-cost').value) || undefined;
    const total_cost_currency = total_cost ? M.$('#he-cost-cur').value : undefined;
    btn.disabled = true; btn.textContent = 'a guardar…';
    try {
      await api('PATCH', `/api/holdings/${h.id}`, {quantity, total_cost, total_cost_currency});
      M.close();
      await onDone();
    } catch(e){
      btn.disabled = false; btn.textContent = 'Guardar';
    }
  };
}

function wireHoldings(m){
  const reload = () => refreshPrices({force: true});

  const refreshBtn = $('#btnRefreshPrices');
  if (refreshBtn) refreshBtn.onclick = async () => {
    refreshBtn.disabled = true; refreshBtn.textContent = 'a atualizar…';
    try { await refreshPrices({force: true}); }
    finally {
      const btn = $('#btnRefreshPrices');
      if (btn) { btn.disabled = false; btn.textContent = '↻ atualizar'; }
    }
  };

  $$('.f-h-add', $('#tab-invest')).forEach(btn => btn.onclick = () => {
    const inv = m.investimentos.find(i => i.id === parseInt(btn.dataset.inv));
    openHoldingPicker(parseInt(btn.dataset.inv), inv ? inv.name : 'investimento', reload);
  });

  $$('.item-row[data-id]', $('#tab-invest')).forEach(row => {
    const id = row.dataset.id;
    const patch = debounce(async (fields) => { await api('PATCH', `/api/holdings/${id}`, fields); await reload(); }, 500);
    const manualInput = row.querySelector('.f-h-manual');
    const qtyInput = row.querySelector('.f-h-qty');
    // onchange, not oninput: half-way through "325,35-49,14" the expression is not
    // yet valid, and saving that would blank the row while the user is still typing.
    if (manualInput) {
      manualInput.onchange = e => patch({manual_value: toNum(e.target.value)});
    } else if (qtyInput) {
      qtyInput.onchange = e => patch({quantity: toNum(e.target.value)});
    }
    const editBtn = row.querySelector('.f-h-edit');
    if (editBtn) editBtn.onclick = () => {
      const h = S.holdings.find(x => String(x.id) === String(id));
      if (h) openHoldingEditor(h, reload);
    };
    row.querySelector('.f-h-del').onclick = async () => {
      if (!confirm('Remover esta posição?')) return;
      await api('DELETE', `/api/holdings/${id}`);
      await reload();
    };
  });
}

      <div class="sub" style="margin-bottom:6px">Por omissão a app trata tudo como uma só conta. Liga o que usas: os cálculos e os ecrãs adaptam-se.</div>
      <div class="field" style="max-width:420px;margin-bottom:10px"><label>Moeda (código de 3 letras)</label>
        <input id="f-currency" list="cur-list" maxlength="3" value="${escAttr(CURRENCY)}" style="text-transform:uppercase">
        <datalist id="cur-list">${['EUR','USD','GBP','BRL','CHF','CAD','AUD','JPY','SEK','NOK','DKK','PLN','CZK','HUF','RON','MXN','ARS','CLP','COP','INR','CNY','ZAR','AOA','MZN','CVE'].map(c => `<option value="${c}">`).join('')}</datalist>
        <div class="sub" style="margin-top:3px">Muda o símbolo e a moeda em que as posições de outras moedas se convertem. Os valores já escritos não são convertidos.</div></div>
      <div class="field" style="max-width:420px"><label>Nome da conta${transferOn() ? ' principal (onde entra o ordenado)' : ''}</label><input id="f-acc-s" value="${escAttr(accLabel('S'))}"></div>
      <label class="switch"><input type="checkbox" id="f-use-transfer" ${transferOn() ? 'checked' : ''}><span class="sw"></span>
        <span><b>Transferir todos os meses para uma segunda conta</b><small>O que sobra da conta principal depois das despesas passa em parte (a %) para a segunda, de onde sai a poupança. Para quem separa «conta do dia a dia» e «conta de poupança».</small></span></label>
      <div class="opt-body" ${transferOn() ? '' : 'hidden'} id="opt-transfer">
        <div class="field" style="max-width:420px"><label>Nome da segunda conta</label><input id="f-acc-r" value="${escAttr(accLabel('R'))}"></div>
        <div class="sub" style="margin-top:6px">Duas contas é o máximo que esta versão calcula. A % a transferir define-se em cada mês.</div>
      </div>
      <label class="switch"><input type="checkbox" id="f-use-joint" ${jointOn() ? 'checked' : ''}><span class="sw"></span>
        <span><b>Conta conjunta (casa partilhada)</b><small>Despesas que se dividem com outra pessoa: cada um põe a sua parte numa conta da casa, e só essa parte conta nas tuas contas.</small></span></label>
    </div>
    <div class="card section-gap" id="card-joint" ${jointOn() ? '' : 'hidden'}>
      <h2>🏠 Conta conjunta</h2>
      <div class="grid cols-2">
        <div class="field"><label>Nome da conta (com quem partilhas despesas)</label><input id="f-joint-name" value="${escAttr(S.settings.joint_account_name||'Conta Conjunta')}"></div>
        <div class="field"><label>Nome do parceiro(a)</label><input id="f-joint-partner-name" value="${escAttr(S.settings.joint_partner_name||'Parceiro(a)')}"></div>
        <div class="field"><label>Como se divide a casa</label>
          <select id="f-joint-mode">
            <option value="percent" ${S.settings.joint_split_mode!=='income'?'selected':''}>Percentagem fixa</option>
            <option value="income" ${S.settings.joint_split_mode==='income'?'selected':''}>Proporção dos ordenados</option>
          </select></div>
        <div class="field" id="wrap-joint-share" ${S.settings.joint_split_mode==='income'?'hidden':''}><label>A minha parte (%)</label><input id="f-joint-myshare" type="text" inputmode="decimal" min="0" max="100" step="1" value="${Math.round((S.settings.joint_my_share ?? 0.5)*1000)/10}"></div>
        <div class="field" id="wrap-joint-income" ${S.settings.joint_split_mode==='income'?'':'hidden'}><label>Rendimento mensal de ${partnerName()}</label><input id="f-joint-pincome" type="text" inputmode="decimal" min="0" step="0.01" value="${S.settings.joint_partner_income || ''}"></div>
        <div class="field"><label>A minha parte sai de</label>
          <select id="f-joint-from"><option value="S" ${jointFrom()==='S'?'selected':''}>${accLabel('S')}</option>${transferOn() ? `<option value="R" ${jointFrom()==='R'?'selected':''}>${accLabel('R')}</option>` : ''}</select></div>
      </div>
      <div class="sub" style="margin-top:6px">Uma despesa com a conta «🏠 ${jointName()}» é da casa: escreve-se pelo valor inteiro (a renda toda), sai da conta conjunta e conta nas tuas contas só pela tua parte. Na proporção dos ordenados, a tua parte é o teu ordenado + extras do mês contra o rendimento de ${partnerName()}. Cada mês pode ter uma parte diferente, no separador Mês; ao fechar um mês, o que cada um pôs fica escrito.</div>
    </div>
    <div class="card section-gap">
      <h2>Divisão da poupança</h2>
      <label class="switch"><input type="checkbox" id="f-auto-split" ${S.settings.auto_balance_geral !== false ? 'checked' : ''}><span class="sw"></span>
        <span><b>Ajustar automaticamente para somar 100%</b><small>Ao mudares uma percentagem, a que escolheres abaixo fica com o que falta. Se o que escreves já não cabe, ajusta-se ao máximo possível e avisa. Desligado, nada se ajusta e a divisão fica a vermelho quando passa dos 100%.</small></span></label>
      <div class="opt-body" id="opt-auto-split" ${S.settings.auto_balance_geral !== false ? '' : 'hidden'}>
        <div class="field" style="max-width:320px"><label>Percentagem que se ajusta sozinha</label>
          <select id="f-auto-target">${[['geral','Geral'],['cofres','Cofres'],['investimentos','Investimentos']].map(([k,l]) => `<option value="${k}" ${(S.settings.auto_balance_target || 'geral') === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
      </div>
    </div>
    <div class="card section-gap">
      <h2>Arredondamento dos cofres e investimentos</h2>
      <label class="row small" style="gap:8px"><input type="checkbox" id="f-round-pots" ${S.settings.round_pots_enabled!==false?'checked':''} style="min-height:auto;width:16px;height:16px"> arredondar cada cofre/investimento aos 0,50 € abaixo</label>
      <label class="row small" style="gap:8px;margin-top:8px"><input type="checkbox" id="f-snap-pct" ${snapOn()?'checked':''} style="min-height:auto;width:16px;height:16px"> acertar a % de cada cofre/investimento para o valor do mês dar 0,50 € certos</label>
      <div class="sub" style="margin-top:6px">O que sobra do arredondamento em cada mês soma-se à Poupança Geral desse mês (tal como no Google Sheets original), e também o que as % deixam por distribuir. A % acerta-se ao largar o deslizador ou ao sair da caixa.</div>
    </div>
    <div class="card section-gap">
      <h2>Corrigir saldos de poupança</h2>
      <label class="row small" style="gap:8px"><input type="checkbox" id="f-target-mode" ${S.settings.use_target_accumulated_mode!==false?'checked':''} style="min-height:auto;width:16px;height:16px"> ao corrigir, escrever o valor real do fim do mês anterior em vez do saldo inicial</label>
      <div class="sub" style="margin-top:6px">Ligado (recomendado): escreves quanto tinhas mesmo no fim do mês passado em cada cofre/investimento/Geral, e a app soma sozinha o que se junta este mês. Desligado: tens de calcular e escrever tu o saldo inicial (sem contar com o mês corrente).</div>
    </div>
    <div class="card section-gap">
      <h2>Sugestões de investimento (IA)</h2>
      <div class="field" style="margin-bottom:14px">
        <label>Fornecedor ativo</label>
        <select id="f-ai-provider">
          <option value="anthropic" ${S.settings.ai_provider==='anthropic'?'selected':''}>Anthropic (Claude)</option>
          <option value="openai" ${S.settings.ai_provider==='openai'?'selected':''}>OpenAI (GPT)</option>
          <option value="gemini" ${S.settings.ai_provider==='gemini'?'selected':''}>Google (Gemini)</option>
          <option value="deepseek" ${S.settings.ai_provider==='deepseek'?'selected':''}>DeepSeek</option>
        </select>
      </div>
      <div class="grid cols-2" style="gap:14px 20px">
        <div class="field">
          <label>Chave Anthropic ${S.settings.anthropic_api_key_set ? '<span class="pill good" style="margin-left:4px">✓</span>' : ''}</label>
          <input id="f-key-anthropic" type="password" placeholder="${S.settings.anthropic_api_key_set ? '••••••••••••••••' : 'sk-ant-...'}" autocomplete="off">
        </div>
        <div class="field">
          <label>Chave OpenAI ${S.settings.openai_api_key_set ? '<span class="pill good" style="margin-left:4px">✓</span>' : ''}</label>
          <input id="f-key-openai" type="password" placeholder="${S.settings.openai_api_key_set ? '••••••••••••••••' : 'sk-...'}" autocomplete="off">
        </div>
        <div class="field">
          <label>Chave Gemini ${S.settings.gemini_api_key_set ? '<span class="pill good" style="margin-left:4px">✓</span>' : ''}</label>
          <input id="f-key-gemini" type="password" placeholder="${S.settings.gemini_api_key_set ? '••••••••••••••••' : 'AIza...'}" autocomplete="off">
        </div>
        <div class="field">
          <label>Chave DeepSeek ${S.settings.deepseek_api_key_set ? '<span class="pill good" style="margin-left:4px">✓</span>' : ''}</label>
          <input id="f-key-deepseek" type="password" placeholder="${S.settings.deepseek_api_key_set ? '••••••••••••••••' : 'sk-...'}" autocomplete="off">
        </div>
      </div>
      <div class="sub" style="margin-top:10px">Só a chave do fornecedor ativo é usada. Chaves em: <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener" style="color:var(--accent2)">console.anthropic.com</a>, <a href="https://platform.openai.com/api-keys" target="_blank" rel="noopener" style="color:var(--accent2)">platform.openai.com</a>, <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener" style="color:var(--accent2)">aistudio.google.com</a>, <a href="https://platform.deepseek.com/api_keys" target="_blank" rel="noopener" style="color:var(--accent2)">platform.deepseek.com</a>. Cada pedido tem um custo pequeno na conta respetiva — a app nunca mostra as chaves de volta depois de guardadas.</div>
    </div>
    <div class="card section-gap">
      <div class="flexrow"><h2 style="margin:0">Catálogo de despesas (usado ao criar um novo mês)</h2><div class="row">${sectionSortSelect('secSortTpl')}<button id="btnAddTpl" class="small">+ item</button></div></div>
      <div class="sub" style="margin-bottom:8px">Editar aqui não altera meses já criados — só o que entra em meses novos. «🏠 ${jointName()}» = despesa da casa, pelo valor inteiro.</div>
      <div id="catListTpl" class="${accChoice() ? '' : 'noacct-tpl'}">${tplHtml}</div>
    </div>
    <div class="card section-gap">
      <h2>Os teus dados</h2>
      <div class="sub" style="margin-bottom:8px">Descarrega tudo o que a app guarda num único ficheiro JSON — meses, despesas, cofres, investimentos e o histórico completo. As chaves de IA não vão no ficheiro.</div>
      <button class="small" id="btnExport">Exportar dados</button>
    </div>
    <div class="card section-gap">
      <button class="danger" id="btnLogout">Terminar sessão</button>
    </div>
  `;
  wireSettingsTab();
}

function wireSettingsTab(){
  const saveLabels = debounce(async () => {
    const labels = {S: $('#f-acc-s').value || 'S', R: $('#f-acc-r').value || 'R'};
    await api('PATCH', '/api/settings', {account_labels: labels});
    S.settings.account_labels = labels;
    renderAll();
  }, 500);
  $('#f-acc-s').oninput = saveLabels;
  $('#f-acc-r').oninput = saveLabels;
  const setScheme = async (key, on) => {
    await api('PATCH', '/api/settings', {[key]: on});
    S.settings[key] = on;
    await reloadAllMonths();
  };
  $('#f-currency').onchange = async e => {
    const code = e.target.value.trim().toUpperCase();
    if (!/^[A-Z]{3}$/.test(code)){ toast('usa o código de 3 letras, por exemplo EUR ou USD', true); e.target.value = CURRENCY; return; }
    await api('PATCH', '/api/settings', {currency: code});
    S.settings.currency = CURRENCY = code;
    Object.keys(fxRates).forEach(k => delete fxRates[k]);
    try { S.holdings = (await api('GET', '/api/holdings')).holdings || S.holdings; } catch(e){}
    renderAll();
  };
  $('#f-auto-split').onchange = async e => {
    $('#opt-auto-split').hidden = !e.target.checked;
    await api('PATCH', '/api/settings', {auto_balance_geral: e.target.checked});
    S.settings.auto_balance_geral = e.target.checked; renderPotsTab();
  };
  $('#f-auto-target').onchange = async e => {
    await api('PATCH', '/api/settings', {auto_balance_target: e.target.value});
    S.settings.auto_balance_target = e.target.value; renderPotsTab();
  };
  $('#f-use-transfer').onchange = e => { $('#opt-transfer').hidden = !e.target.checked; setScheme('use_transfer', e.target.checked); };
  $('#f-use-joint').onchange = e => { $('#card-joint').hidden = !e.target.checked; setScheme('use_joint', e.target.checked); };

  const saveJointName = debounce(async () => {
    const name = $('#f-joint-name').value || 'Conta Conjunta';
    await api('PATCH', '/api/settings', {joint_account_name: name});
    S.settings.joint_account_name = name;
    renderDashboard(); renderMonthTab();
  }, 500);
  $('#f-joint-name').oninput = saveJointName;

  const saveJointPartnerName = debounce(async () => {
    const name = $('#f-joint-partner-name').value || 'Parceiro(a)';
    await api('PATCH', '/api/settings', {joint_partner_name: name});
    S.settings.joint_partner_name = name;
    renderDashboard(); renderMonthTab();
  }, 500);
  $('#f-joint-partner-name').oninput = saveJointPartnerName;

  // Mudar a regra refaz os meses abertos; os fechados guardaram o que cada um pôs.
  const saveJointRule = debounce(async (fields) => {
    await api('PATCH', '/api/settings', fields);
    Object.assign(S.settings, fields);
    const res = await api('GET','/api/months');
    S.months = res.months.sort((a,b)=> a.year-b.year || a.month-b.month);
    renderDashboard(); renderMonthTab();
  }, 500);
  $('#f-joint-mode').onchange = e => {
    $('#wrap-joint-share').hidden = e.target.value === 'income';
    $('#wrap-joint-income').hidden = e.target.value !== 'income';
    saveJointRule({joint_split_mode: e.target.value});
  };
  $('#f-joint-myshare').oninput = e => saveJointRule({joint_my_share: Math.max(0, Math.min(100, toNum(e.target.value))) / 100});
  $('#f-joint-pincome').oninput = e => saveJointRule({joint_partner_income: toNum(e.target.value)});
  $('#f-joint-from').onchange = e => saveJointRule({joint_from_account: e.target.value});

  $('#f-snap-pct').onchange = async (e) => {
    S.settings.snap_round_pct = e.target.checked;
    renderPotsTab(); renderInvestTab();
    try { await api('PATCH', '/api/settings', {snap_round_pct: e.target.checked}); } catch (err) {}
  };
  $('#f-round-pots').onchange = async (e) => {
    await api('PATCH', '/api/settings', {round_pots_enabled: e.target.checked});
    S.settings.round_pots_enabled = e.target.checked;
    const m = curMonth();
    if (m) { S.months[S.currentIdx] = await refreshMonth(m.id); }
    renderDashboard(); renderMonthTab(); renderPotsTab(); renderInvestTab();
  };

  $('#f-target-mode').onchange = async (e) => {
    await api('PATCH', '/api/settings', {use_target_accumulated_mode: e.target.checked});
    S.settings.use_target_accumulated_mode = e.target.checked;
    renderPotsTab(); renderInvestTab();
  };

  $('#f-ai-provider').onchange = async (e) => {
    await api('PATCH', '/api/settings', {ai_provider: e.target.value});
    S.settings.ai_provider = e.target.value;
    renderInvestTab();  // the advice card names the active provider
  };

  [['anthropic','f-key-anthropic'],['openai','f-key-openai'],['gemini','f-key-gemini'],['deepseek','f-key-deepseek']].forEach(([provider, id]) => {
    const input = $('#'+id);
    if (!input) return;
    const save = debounce(async () => {
      const val = input.value;
      if (!val) return;
      await api('PATCH', '/api/settings', {[`${provider}_api_key`]: val});
      S.settings[`${provider}_api_key_set`] = true;
      renderSettingsTab();
      toast('chave guardada');
    }, 600);
    input.oninput = save;
  });

  $$('.item-row[data-kind=tpl]', $('#tab-settings')).forEach(row => {
    const id = row.dataset.id;
    const patch = debounce(async (fields) => { await api('PATCH', `/api/templates/${id}`, fields); }, 450);
    row.querySelector('.f-name').oninput = e => patch({name: e.target.value});
    row.querySelector('.f-planned').oninput = e => patch({default_planned: toNum(e.target.value)||0});
    const accSel = row.querySelector('.f-account');
    if (accSel) accSel.onchange = async e => {
      await api('PATCH', `/api/templates/${id}`, accountPatch(e.target.value));
      S.templates = (await api('GET','/api/templates')).templates;
    };
    row.querySelector('.f-active').onchange = e => patch({active: e.target.checked});
    row.querySelector('.f-del').onclick = async () => {
      if (!confirm('Remover do catálogo?')) return;
      await api('DELETE', `/api/templates/${id}`);
      const [tplRes] = await Promise.all([api('GET','/api/templates')]);
      S.templates = tplRes.templates;
      renderSettingsTab();
    };
  });

  const addTpl = $('#btnAddTpl');
  if (addTpl) addTpl.onclick = async () => {
    const cat = prompt('Categoria'); if (!cat) return;
    const name = prompt('Nome do item'); if (!name) return;
    await api('POST', '/api/templates', {category: cat.toUpperCase(), name, default_planned:0, account:'S'});
    const tplRes = await api('GET','/api/templates');
    S.templates = tplRes.templates;
    renderSettingsTab();
  };

  const reloadTemplatesAfterEdit = async () => {
    const tplRes = await api('GET','/api/templates');
    S.templates = tplRes.templates;
    renderSettingsTab();
  };
  wireSectionSort($('#secSortTpl'));
  wireSectionDrag($('#catListTpl'));
  $$('.cat-group', $('#tab-settings')).forEach(group => {
    wireDragReorder(group, '.item-row[data-kind=tpl]', 'expense_templates', reloadTemplatesAfterEdit);
    const sortBtn = group.querySelector('.f-sort-cat');
    if (sortBtn) sortBtn.onclick = () => {
      const cat = group.dataset.cat;
      const items = S.templates.filter(t => t.category === cat);
      sortAlphabetically('expense_templates', items, reloadTemplatesAfterEdit);
    };
  });

  const exportBtn = $('#btnExport');
  // Straight navigation, not fetch(): the endpoint answers with Content-Disposition,
  // so the browser saves the file and the page stays where it is. The session cookie
  // rides along on its own.
  if (exportBtn) exportBtn.onclick = () => { toast('a preparar o ficheiro…'); location.href = '/api/export'; };

  const logout = $('#btnLogout');
  if (logout) logout.onclick = async () => { await api('POST','/api/auth/logout'); location.reload(); };
}

// ------------------------------------------------------------------- init --
checkAuth();
</script>
</body>
</html>
