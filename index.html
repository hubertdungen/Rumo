<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rumo — gestão financeira pessoal</title>
<meta name="description" content="Rendimento, despesas, poupanças e investimentos — planeamento mensal com percentagens e dashboard de análise.">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rumo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='rgFav' x1='4' y1='54' x2='56' y2='8' gradientUnits='userSpaceOnUse'%3E%3Cstop offset='0' stop-color='%230e8f66'/%3E%3Cstop offset='0.55' stop-color='%2322c58b'/%3E%3Cstop offset='1' stop-color='%237ff0d6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='30' fill='%230b0f14'/%3E%3Ccircle cx='32' cy='32' r='29' fill='none' stroke='url(%23rgFav)' stroke-width='2' opacity='0.55'/%3E%3Cpath d='M32 10 L49 33 L32 26.5 L15 33 Z' fill='url(%23rgFav)'/%3E%3Ccircle cx='32' cy='17.5' r='3.2' fill='%230b0f14'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0b0f14; --panel:#131922; --panel2:#1a2230; --line:#263040;
  --txt:#e8eef5; --dim:#8996a6; --accent:#22c58b; --accent2:#5eead4;
  --good:#3ecf8e; --bad:#ff6b6b; --blue:#5aa9ff; --gold:#f5b942; --purple:#8b6bff;
  --r:14px; --san:#ff5252; --rev:#5b8cff;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--txt);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  padding-bottom:78px;
}
.wrap{max-width:1200px;margin:0 auto;padding:18px 18px 8px}
a{color:inherit}
button{
  background:var(--panel2); color:var(--txt); border:1px solid var(--line);
  padding:9px 14px; border-radius:10px; cursor:pointer; font-size:13px; font-weight:600;
  transition:.15s; min-height:38px;
}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent); color:#04140e; border-color:var(--accent)}
button.primary:hover{background:var(--accent2)}
button.danger{color:var(--bad)}
button.ghost{background:transparent;border-color:transparent;padding:6px 8px}
button:disabled{opacity:.45;cursor:default}
input,select,textarea{
  background:var(--panel2); color:var(--txt); border:1px solid var(--line);
  padding:8px 10px; border-radius:9px; font-size:14px; font-family:inherit; min-height:38px;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
input[type=number]{width:100%}
label{font-size:11.5px;color:var(--dim);display:block;margin-bottom:4px;letter-spacing:.2px}
.field{display:flex;flex-direction:column;gap:2px}
/* .field's display:flex is an author rule, so it beats the browser's own
   [hidden]{display:none} -- without this, hiding a field does nothing. */
[hidden]{display:none !important}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px}
.grid.cols-2{grid-template-columns:repeat(2,1fr)}
.grid.cols-3{grid-template-columns:repeat(3,1fr)}
.grid.cols-4{grid-template-columns:repeat(4,1fr)}
.grid.cols-5{grid-template-columns:repeat(5,1fr)}
@media (max-width:900px){
  .grid.cols-3,.grid.cols-4,.grid.cols-5{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:560px){
  .grid.cols-2,.grid.cols-3,.grid.cols-4,.grid.cols-5{grid-template-columns:1fr}
  .wrap{padding:12px 12px 8px}
}
.metric{padding:14px 16px}
.metric .lbl{font-size:11.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.4px}
.metric .val{font-size:22px;font-weight:800;margin-top:4px;letter-spacing:-.3px}
.metric .delta{font-size:12px;margin-top:4px;font-weight:600}
.delta.up{color:var(--good)}
.delta.down{color:var(--bad)}
.delta.flat{color:var(--dim)}
h1{font-size:24px;margin:0;letter-spacing:-.6px;font-weight:800}
h2{font-size:16px;margin:0 0 12px;font-weight:700}
h3{font-size:13px;margin:0 0 8px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.4px}
.sub{color:var(--dim);font-size:12.5px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:34px;height:34px;flex:none}
.monthnav{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px}
.monthnav .lbl{font-weight:700;min-width:92px;text-align:center;font-size:13.5px}
.tabs{display:flex;gap:6px;position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);padding:8px;justify-content:space-around;z-index:20}
.move{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:8px}
.move.done{opacity:.5}
.move.done .move-amt{text-decoration:line-through}
.move .num{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);font-weight:800;font-size:12px;color:var(--dim)}
.move.done .num{background:var(--accent);color:#04140e}
.move-title{font-weight:700;font-size:14px}
.move-route{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px;font-size:12.5px;color:var(--dim)}
.move-route b{color:var(--txt);background:var(--panel2);padding:2px 8px;border-radius:99px;font-weight:600}
.move-amt{font-weight:800;font-size:17px;text-align:right;white-space:nowrap}
.move-side{display:flex;gap:8px;align-items:center;justify-content:flex-end}
.move-side button{min-height:30px;padding:4px 10px;font-size:12px}
.move details{margin-top:6px;font-size:12px;color:var(--dim)}
.move details summary{cursor:pointer}
.move-lines{display:grid;grid-template-columns:1fr auto;gap:2px 14px;margin-top:6px}
.move-go{color:inherit;text-decoration:none;cursor:pointer}
.move-go:hover{text-decoration:underline;text-underline-offset:3px}
.move-fix{font-size:12px;color:var(--dim);margin-left:6px;font-weight:400}
.move-go:hover .move-fix{color:var(--txt)}
.move-lines a{color:inherit;text-decoration:none;cursor:pointer}
.move-lines a:hover{color:var(--txt);text-decoration:underline}
/* A caixa de onde veio o valor pisca ao chegar lá vinda dos Movimentos. */
.flash{outline:2px solid var(--accent);outline-offset:3px;border-radius:10px;transition:outline-color 1.2s}
.flash-out{outline-color:transparent}
.move-group{margin:18px 0 8px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--tone,var(--dim))}
.move{box-shadow:inset 3px 0 0 var(--tone,transparent)}
.move .move-title,.move .move-go{color:var(--tone,var(--txt))}
.move .num{color:var(--tone,var(--dim));background:color-mix(in srgb,var(--tone,transparent) 14%,var(--panel2))}
@media(max-width:640px){.move{grid-template-columns:26px 1fr}.move-side{grid-column:2;justify-content:flex-start}}
.tabs button{flex:1;background:transparent;border:none;color:var(--dim);font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;min-height:auto}
.tabs button.active{color:var(--accent)}
.tabs button svg{width:20px;height:20px}
.tabsec{display:none}
.tabsec.active{display:block}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.pill.good{color:var(--good);border-color:rgba(62,207,142,.4)}
.pill.bad{color:var(--bad);border-color:rgba(255,107,107,.4)}
.acc-tag{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;letter-spacing:.3px}
.acc-tag.S{background:rgba(255,82,82,.15);color:var(--san)}
.acc-tag.R{background:rgba(91,140,255,.15);color:var(--rev)}
.source-tag{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:6px;letter-spacing:.3px;background:rgba(94,234,212,.12);color:var(--accent2);border:1px solid rgba(94,234,212,.25)}
/* Cada app na sua cor: o Fatia é laranja (o --accent dele). */
/* O logótipo usa currentColor: como máscara, pinta-se com a cor do Fatia. */
.app-ico{flex:0 0 auto;width:30px;height:22px;display:inline-block;background:#ff9f2e;
  -webkit-mask:url(fatia.svg) center/contain no-repeat;mask:url(fatia.svg) center/contain no-repeat}
.source-tag.fatia{background:rgba(255,159,46,.13);color:#ff9f2e;border-color:rgba(255,159,46,.32)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.3px;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:none}
.cat-group{margin-bottom:4px}
.cat-head{display:flex;align-items:center;justify-content:space-between;padding:9px 8px;background:var(--panel2);border-radius:9px;margin:10px 0 4px;cursor:pointer;font-weight:700;font-size:12.5px;letter-spacing:.3px}
.cat-head .amt{color:var(--accent);font-weight:800}
/* Emoji de cada secção/linha/cofre: um clique abre a grelha para o trocar. */
.emo{flex:0 0 auto;width:30px;height:30px;min-height:auto;padding:0;border:1px solid transparent;border-radius:8px;
  background:transparent;font-size:17px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.emo:hover{border-color:var(--line);background:var(--panel)}
.cat-title{display:inline-flex;align-items:center;gap:6px}
.name-cell{display:flex;align-items:center;gap:6px;min-width:0}
.name-cell input{flex:1 1 auto;min-width:0}
/* Linhas do Giro: os valores vêm de lá e são reescritos a cada sincronização. */
.item-row.from-giro input[readonly],.item-row.from-giro select:disabled{opacity:.55;cursor:not-allowed;
  background:transparent;border-style:dashed}
/* O tom de cada secção: uma cor por nome, fraca o bastante para não mudar o estilo. */
.cat-group[style*="--h"] .cat-head{background:linear-gradient(90deg,hsl(var(--h) 55% 55% / .15),var(--panel2) 65%);
  box-shadow:inset 3px 0 0 hsl(var(--h) 60% 62% / .75)}
.cat-group[style*="--h"] .item-row{box-shadow:inset 2px 0 0 hsl(var(--h) 60% 62% / .22)}
.emo-pop{position:fixed;z-index:60;width:min(320px,calc(100vw - 24px));background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:10px;box-shadow:0 18px 50px rgba(0,0,0,.5)}
.emo-pop .emo-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;max-height:210px;overflow:auto;margin:8px 0}
.emo-pop .emo-grid button{min-height:auto;height:34px;padding:0;font-size:18px;background:transparent;border-color:transparent}
.emo-pop .emo-grid button:hover,.emo-pop .emo-grid button.on{background:var(--panel2);border-color:var(--accent)}
.emo-pop .emo-foot{display:flex;gap:6px;align-items:center}
.emo-pop .emo-foot input{flex:1 1 auto;min-width:0}
.item-row{display:grid;grid-template-columns:22px 1.3fr .8fr 78px 178px 150px;gap:8px;align-items:center;padding:6px 8px}
.item-row[data-kind=tpl]{grid-template-columns:22px 1.3fr 90px 178px 70px 50px}
.item-row .trailing{display:flex;align-items:center;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.item-row input{font-size:13px;padding:6px 8px;min-height:32px}
@media (max-width:700px){
  /* !important because the holdings rows carry their column widths inline, and an
     inline style beats a media query -- so on a phone they never actually stacked. */
  .item-row{grid-template-columns:1fr !important;gap:6px;background:var(--panel2);border-radius:9px;margin-bottom:6px;padding:10px}
}

/* ---- Fluxo do mês: conta principal (vermelho) → segunda conta (azul) ---- */
.flow{display:grid;grid-template-columns:minmax(0,1fr) minmax(170px,250px) minmax(0,1fr);align-items:stretch}
.acct{--c:var(--dim);border-radius:14px;padding:16px;border:1px solid color-mix(in srgb,var(--c) 38%,var(--line));
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 15%,var(--panel)),var(--panel) 72%)}
.acct.S{--c:var(--san)} .acct.R{--c:var(--rev)}
.acct h3{margin:0 0 12px;display:flex;align-items:center;gap:8px;color:var(--c);font-size:12.5px;letter-spacing:.6px;text-transform:uppercase}
.acct h3::before{content:'';width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.acct .big{font-size:27px;font-weight:800;letter-spacing:-.5px;margin:2px 0 8px}
.acct .big small{display:block;font-size:11px;font-weight:600;color:var(--dim);letter-spacing:.3px;text-transform:uppercase}
.acct .ln{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:6px 0;border-top:1px dashed var(--line)}
.acct .ln span:first-child{color:var(--dim)}
.acct .ln b{font-variant-numeric:tabular-nums}
.acct .field{margin-bottom:10px}
.acct input[type=range]{accent-color:var(--c);width:100%}
.bridge{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:8px 14px;text-align:center}
.bridge .cap{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
.bridge .amt{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.bridge .pipe{position:relative;width:100%;height:12px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
.bridge .pipe i{position:absolute;left:0;top:0;bottom:0;width:calc(var(--p) * 100%);border-radius:99px;transition:width .25s;
  background:linear-gradient(90deg,var(--san),var(--rev))}
.bridge .pipe i::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 12px,rgba(255,255,255,.4) 12px 20px);
  background-size:40px 100%;animation:flowmove 1.1s linear infinite}
@keyframes flowmove{to{background-position:40px 0}}
@media(prefers-reduced-motion:reduce){.bridge .pipe i::after{animation:none}}
.bridge .arrow{font-size:22px;line-height:1;color:var(--rev)}
.acct input[type=range],.bridge input[type=range]{background:transparent;border:0;padding:0;min-height:0;height:22px;flex:none}
.bridge input[type=range]{width:100%;accent-color:var(--rev)}
.bridge .pctlbl{font-weight:800;font-size:15px}
@media(max-width:800px){.flow{grid-template-columns:1fr}.bridge{padding:14px 0}.bridge .arrow{transform:rotate(90deg)}}
.noacct .item-row{grid-template-columns:22px 1.3fr .8fr 96px 120px}
.noacct-tpl .item-row[data-kind=tpl]{grid-template-columns:22px 1.3fr 96px 70px 50px}
.switch{display:flex;align-items:center;gap:12px;cursor:pointer;padding:10px 0}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch .sw{flex:0 0 auto;width:44px;height:26px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);position:relative;transition:background .2s,border-color .2s}
.switch .sw::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--dim);transition:transform .22s cubic-bezier(.2,.7,.2,1),background .2s}
.switch input:checked + .sw{background:color-mix(in srgb,var(--accent) 30%,var(--panel2));border-color:var(--accent)}
.switch input:checked + .sw::after{transform:translateX(18px);background:var(--accent)}
.switch input:focus-visible + .sw{outline:2px solid var(--accent2);outline-offset:2px}
.switch b{display:block;font-size:14px}.switch small{display:block;color:var(--dim);font-size:12px;line-height:1.35;margin-top:2px}
.opt-body{margin:4px 0 6px 56px;padding:12px 14px;border-left:2px solid var(--line)}
@media(max-width:700px){.opt-body{margin-left:6px}.noacct .item-row,.noacct-tpl .item-row[data-kind=tpl]{grid-template-columns:1fr !important}}
.stiles > div{display:flex;flex-direction:column;gap:2px}
.stiles .v.editable{cursor:text;border-bottom:1px dashed transparent;transition:border-color .15s;align-self:flex-start;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.stiles .v.editable:hover{border-bottom-color:var(--dim)}
.stiles .v input{width:100%;font:inherit;font-weight:800;background:var(--panel);border:1px solid var(--c);border-radius:8px;padding:0 6px;min-height:30px}
.pctin{display:flex;align-items:center;gap:3px;margin:2px 0 0;color:var(--dim)}
.pctin input{width:68px;min-height:28px;padding:2px 6px;font-size:13px;text-align:right}
.autob{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;padding:1px 6px;border-radius:99px;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c)}
.split-warn{margin-top:10px;padding:9px 12px;border-radius:10px;font-size:13px;font-weight:600;color:var(--bad);background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.35);animation:fadein .3s both}
input.over{border-color:var(--bad);color:var(--bad);box-shadow:0 0 0 3px rgba(255,107,107,.12)}
.dual{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;margin:4px 0}
.dbox{display:flex;align-items:center;gap:4px;margin:0;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:0 10px;transition:border-color .15s,box-shadow .15s}
.dbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.dbox input{border:0;background:transparent;width:78px;text-align:right;font-weight:800;min-height:34px;padding:4px 0;font-size:15px;font-variant-numeric:tabular-nums}
.dbox input:focus{outline:none}.dbox span{color:var(--dim);font-weight:700;font-size:13px}.dsep{color:var(--dim)}
.acct.solo{max-width:640px;margin:0 auto}
.acct .step{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:7px 0;border-top:1px dashed var(--line)}
.acct .step.sum{font-weight:800;border-top:1px solid color-mix(in srgb,var(--c) 40%,var(--line))}
.acct .step span:first-child{color:var(--dim)}.acct .step.sum span:first-child{color:var(--txt)}
select.f-account{font-weight:600;border-left-width:3px}
select.f-account[data-v=S]{border-color:rgba(255,82,82,.5);background-color:rgba(255,82,82,.09)}
select.f-account[data-v=R]{border-color:rgba(91,140,255,.5);background-color:rgba(91,140,255,.10)}
select.f-account[data-v=J]{border-color:rgba(245,185,66,.45);background-color:rgba(245,185,66,.08)}
.item-row:hover{background:color-mix(in srgb,var(--panel2) 55%,transparent);border-radius:9px}
.item-row .f-planned{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.item-row.zero .f-planned{opacity:.45;font-weight:500}
.item-row.zero .f-name{opacity:.8}
.msearch{position:relative;flex:1 1 200px;min-width:160px;max-width:300px}
.msearch input{width:100%;padding-left:32px;border-radius:99px;min-height:36px}
.msearch::before{content:'⌕';position:absolute;left:12px;top:50%;transform:translateY(-52%);color:var(--dim);font-size:16px;pointer-events:none}
.msearch kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:600 10.5px/1 inherit;color:var(--dim);border:1px solid var(--line);border-radius:5px;padding:2px 5px;pointer-events:none}
.msearch input:focus + kbd{display:none}
.tile{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px !important}
.legend3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.legend3 > div{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;border-left:3px solid var(--c)}
.legend3 .n{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.4px}
.legend3 .v{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.legend3 .v small{color:var(--dim);font-weight:600;font-size:12px}
@media(max-width:560px){.legend3{grid-template-columns:1fr}}
.mm-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.mm-head b{font-size:20px}
.mm-key{display:flex;gap:12px;font-size:11.5px;color:var(--dim)}
.mm-key i,.mm-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--c)}
.mm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));column-gap:32px}
.mm-row{margin-bottom:11px}
.mm-row .progress{height:7px}
.mm-row em{font-style:normal;color:var(--dim);font-size:11.5px;margin-left:6px}

<script>
'use strict';

// ---------------------------------------------------------------- helpers --
const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
const fmt = (n) => (n==null||isNaN(n) ? '—' : n.toLocaleString('pt-PT', {minimumFractionDigits:2, maximumFractionDigits:2}));
let CURRENCY = 'EUR';
const curSym = c => { try { return (0).toLocaleString('pt-PT', {style:'currency', currency:c, currencyDisplay:'narrowSymbol'}).replace(/[\d\s.,\u00a0]/g, '') || c; } catch(e){ return c; } };
const eur = (n) => fmt(n) + ' ' + curSym(CURRENCY);
// A moeda de base e outra para o custo de uma posição (por omissão, dólares; em dólares, euros).
const curOptions = () => { const other = CURRENCY === 'USD' ? 'EUR' : 'USD'; return `<option value="${CURRENCY}">${curSym(CURRENCY)}</option><option value="${other}">${curSym(other)}</option>`; };
// Recursive descent rather than eval: the fields take arithmetic ("325,35-49,14"
// stores 276,21), and a half-typed expression must yield NaN quietly instead of
// throwing. Returns NaN for anything it can't parse end to end.
function evalExpr(src){
  let i = 0;
  const peek = () => src[i];
  const atom = () => {
    if (peek() === '('){
      i++;
      const v = expr();
      if (peek() !== ')') return NaN;
      i++;
      return v;
    }
    const start = i;
    while (i < src.length && /[0-9.]/.test(src[i])) i++;
    return i === start ? NaN : parseFloat(src.slice(start, i));
  };
  const unary = () => {
    if (peek() === '-'){ i++; return -unary(); }
    if (peek() === '+'){ i++; return unary(); }
    return atom();
  };
  const term = () => {
    let v = unary();
    while (peek() === '*' || peek() === '/'){
      const op = src[i++], r = unary();
      v = op === '*' ? v * r : v / r;
    }
    return v;
  };
  const expr = () => {
    let v = term();
    while (peek() === '+' || peek() === '-'){
      const op = src[i++], r = term();
      v = op === '+' ? v + r : v - r;
    }
    return v;
  };
  const out = expr();
  return i === src.length ? out : NaN;  // trailing junk means it wasn't an expression
}

// Accepts "0,083" (PT decimal comma) as well as "0.083" -- parseFloat alone silently
// truncates at the comma -- plus arithmetic, currency symbols and PT thousands dots.
const toNum = (s) => {
  let t = String(s ?? '').trim().replace(/[\s\u00a0€$]/g, '');
  if (!t) return 0;
  // With a comma present the dots can only be thousands separators (1.234,56).
  t = t.includes(',') ? t.replace(/\./g, '').replace(/,/g, '.') : t;
  if (/^[0-9.+\-*/()]+$/.test(t)){
    const v = evalExpr(t);
    if (!isNaN(v) && isFinite(v)) return v;
  }
  const v = parseFloat(t);
  return isNaN(v) ? 0 : v;
};
const pct = (n) => (n==null||isNaN(n) ? '—' : Math.round(n*1000)/10 + '%');
// Units, unlike money: a fraction of an ounce or a satoshi needs the decimals kept,
// but not the trailing zeros that make 0,08062276 unreadable.
const qtyStr = (n) => {
  if (n == null || isNaN(n)) return '';
  return (Math.abs(n) < 1 ? n.toFixed(8) : n.toFixed(6))
    .replace(/0+$/, '').replace(/\.$/, '').replace('.', ',');
};
const clamp01 = (n) => Math.max(0, Math.min(1, n));
let toastTimer = null;
function openModal(innerHTML){
  const back = document.createElement('div');
  back.className = 'modal-back';
  back.innerHTML = `<div class="modal">${innerHTML}</div>`;
  document.body.appendChild(back);
  const close = () => { back.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  back.addEventListener('click', e => { if (e.target === back) close(); });
  document.addEventListener('keydown', onKey);
  return {el: back, close, $: sel => back.querySelector(sel)};
}

// Amounts can be typed in dollars, and the preview has to agree with what the
// server will store -- so keep the rates the server already caches, fetched once.
const fxRates = {};
async function loadFxRate(cur){
  if (cur === CURRENCY || fxRates[cur] != null) return;
  try {
    const res = await api('GET', `/api/market/fx?from=${encodeURIComponent(cur)}`);
    fxRates[cur] = res.rate;
  } catch(e){ /* o api() já avisou; toEur devolve null e o preview di-lo */ }
}
// null means "rate not in yet", which the previews report rather than showing a
// dollar figure with a euro sign on it.
function toEur(str, cur){
  const v = toNum(str);
  if (!v) return 0;
  if (cur === CURRENCY) return v;
  return fxRates[cur] == null ? null : v * fxRates[cur];
}

function toast(msg, isErr=false){
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.className = 'toast', 2600);
}

async function api(method, path, body){
  const opts = { method, credentials:'include', headers:{} };
  if (body !== undefined){ opts.headers['Content-Type']='application/json'; opts.body = JSON.stringify(body); }
  const res = await fetch(path, opts);
  let data = null;
  try { data = await res.json(); } catch(e){ /* no body */ }
  if (!res.ok){
    const msg = (data && data.error) || `erro ${res.status}`;
    toast(msg, true);
    throw new Error(msg);
  }
  return data;
}

function debounce(fn, ms){
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(()=>fn(...args), ms); };
}

// Generic drag-to-reorder for a set of sibling elements sharing a container.
// itemSelector must match elements with draggable="true" and a data-id attribute.
function wireDragReorder(container, itemSelector, table, onReordered){
  if (!container) return;
  const items = () => Array.from(container.querySelectorAll(itemSelector));
  let dragEl = null;
  items().forEach(el => {
    const handle = el.querySelector('.drag-handle');
    if (handle) {
      handle.addEventListener('mousedown', () => { el.draggable = true; });
      handle.addEventListener('touchstart', () => { el.draggable = true; }, {passive:true});
    }
    el.addEventListener('dragstart', () => { dragEl = el; setTimeout(()=>el.classList.add('dragging'),0); });
    el.addEventListener('dragend', () => { el.classList.remove('dragging'); el.draggable = false; dragEl = null; });
  });
  container.ondragover = (e) => {
    e.preventDefault();
    if (!dragEl) return;
    const target = e.target.closest(itemSelector);
    if (!target || target === dragEl || target.parentNode !== dragEl.parentNode) return;
    const rect = target.getBoundingClientRect();
    const before = e.clientY < rect.top + rect.height/2;
    target.parentNode.insertBefore(dragEl, before ? target : target.nextSibling);
  };
  container.ondrop = async (e) => {
    e.preventDefault();
    if (!dragEl) return;
    const ids = items().map(x => x.dataset.id);
    await api('POST', '/api/reorder', {table, ids});
    if (onReordered) await onReordered();
  };
}

async function sortAlphabetically(table, entities, onReordered){
  const ids = [...entities].sort((a,b) => a.name.localeCompare(b.name, 'pt')).map(e => e.id);
  await api('POST', '/api/reorder', {table, ids});
  if (onReordered) await onReordered();
}

function renderAuthForm(canRegister){
  const el = $('#authForm');
  el.innerHTML = `
    <div class="field"><label>Utilizador</label><input id="authUser" autocomplete="username"></div>
    <div class="field"><label>Password</label><input id="authPass" type="password" autocomplete="current-password"></div>
    <div class="row" style="margin-top:14px">
      <button class="primary" id="btnLogin" style="flex:1">Entrar</button>
      ${canRegister ? '<button id="btnRegister" style="flex:1">Criar conta</button>' : ''}
    </div>
    <div class="sub" style="margin-top:10px" id="authMsg"></div>
  `;
  $('#btnLogin').onclick = () => doAuth('/api/auth/login');
  const rb = $('#btnRegister');
  if (rb) rb.onclick = () => doAuth('/api/auth/register');
  // Sem <form> a envolver os campos, a tecla Ir/Enter do teclado nao submetia nada.
  for (const id of ['#authUser', '#authPass']) {
    $(id).onkeydown = (e) => { if (e.key === 'Enter') doAuth('/api/auth/login'); };
  }

function showApp(){
  $('#auth').classList.add('hidden');
  $('#app').classList.remove('hidden');
}

async function doAuth(path){
  const username = $('#authUser').value.trim();
  const password = $('#authPass').value;
  if (!username || !password){ toast('preenche utilizador e password', true); return; }
  // Enquanto o pedido vai e vem, os botoes ficam presos: cada toque a mais criava
  // uma sessao nova no servidor e nao adiantava nada.
  const buttons = [$('#btnLogin'), $('#btnRegister')].filter(Boolean);
  buttons.forEach(b => b.disabled = true);
  try {
    const data = await api('POST', path, {username, password});
    S.user = data.user;
    showApp();
    await boot();
  } catch(e){ /* toast already shown */ }
  finally { buttons.forEach(b => b.disabled = false); }
}

async function checkAuth(){
  const data = await api('GET', '/api/auth/me');
  if (data.user){
    S.user = data.user;
    showApp();
    await boot();
  } else {
    $('#app').classList.add('hidden');
    $('#auth').classList.remove('hidden');
    renderAuthForm(data.can_register);
  }
}

async function boot(){
  $('#userLine').textContent = S.user ? `sessão: ${S.user.username}` : '';
  const [monthsRes, potsRes, invRes, tplRes, setRes, holdRes] = await Promise.all([
    api('GET','/api/months'),
    api('GET','/api/pots'),
    api('GET','/api/investments'),
    api('GET','/api/templates'),
    api('GET','/api/settings'),
    api('GET','/api/holdings'),
  ]);
  S.months = monthsRes.months.sort((a,b)=> a.year-b.year || a.month-b.month);
  S.pots = potsRes.pots;
  S.investimentos = invRes.investimentos;
  S.templates = tplRes.templates;
  S.settings = setRes.settings;
  CURRENCY = S.settings.currency || 'EUR';
  S.holdings = holdRes.holdings;
  const view = loadView();
  const savedIdx = S.months.findIndex(m => m.id === view.monthId);
  S.currentIdx = savedIdx >= 0 ? savedIdx : S.months.length - 1;
  renderAll();
  if (view.tab && $(`#tab-${view.tab}`)) showTab(view.tab, true);
  if (view.y){
    restoringView = true;
    requestAnimationFrame(() => { scrollTo(0, view.y); setTimeout(() => { restoringView = false; }, 300); });
  }
  refreshPrices({force: true});
  startPriceAutoRefresh();
  liftLocalMoves().then(moved => moved && renderMovesTab(), () => {});
}

async function refreshMonth(monthId){
  const data = await api('GET', `/api/months/${monthId}`);
  const idx = S.months.findIndex(m => m.id === monthId);
  if (idx >= 0) S.months[idx] = data.month;

}

// Quotes refresh themselves: on load, when the app comes back to the foreground,
// and on a slow timer. Re-rendering under a cursor would throw away what someone is
// typing, so a focused field in the holdings list postpones the cycle.
const PRICE_REFRESH_MS = 5 * 60 * 1000;
let priceRefreshBusy = false;

async function refreshPrices({force = false} = {}){
  if (priceRefreshBusy) return;
  if (!force && S.pricesAt && Date.now() - S.pricesAt < 60 * 1000) return;
  const editing = document.activeElement;
  if (!force && editing && editing.closest && editing.closest('#tab-invest') &&
      /INPUT|SELECT|TEXTAREA/.test(editing.tagName)) return;
  priceRefreshBusy = true;
  try {
    const res = await api('GET', '/api/holdings/prices');
    S.holdings = res.holdings;
    S.pricesAt = Date.now();
    renderDashboard();
    renderInvestTab();
  } catch(e){ /* o api() já avisou */ }
  finally { priceRefreshBusy = false; }
}

function startPriceAutoRefresh(){
  setInterval(() => { if (!document.hidden) refreshPrices(); }, PRICE_REFRESH_MS);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshPrices(); });
}

function pricesAgeLabel(){
  if (!S.pricesAt) return 'ainda sem cotações';
  const mins = Math.floor((Date.now() - S.pricesAt) / 60000);
  return mins < 1 ? 'atualizado agora' : `atualizado há ${mins} min`;
}

/* Redesenhar um separador troca as caixas por outras novas, e a que tinha o
   cursor desaparecia a meio da escrita (um segundo depois de cada tecla, quando
   a gravação voltava). Guarda-se qual era -- pelo id, ou pela linha e a classe
   dentro do mesmo separador -- e o que lá estava escrito, e devolve-se depois. */
function focusSelector(el){
  if (!el || !el.matches || !el.matches('input:not([type=range]):not([type=checkbox]):not([type=radio]),textarea')) return null;
  if (el.id) return '#' + CSS.escape(el.id);
  const tab = el.closest('.tabsec'), holder = el.closest('[data-id]');
  const cls = [...el.classList].map(c => '.' + CSS.escape(c)).join('');
  if (!tab || !tab.id || !holder || !cls) return null;
  const kind = holder.dataset.kind ? `[data-kind="${CSS.escape(holder.dataset.kind)}"]` : '';
  return `#${CSS.escape(tab.id)} [data-id="${CSS.escape(holder.dataset.id)}"]${kind} ${cls}`;
}
function keepFocus(fn){
  return function(...args){
    const el = document.activeElement, sel = focusSelector(el);
    let typed, start, end;
    // Só se devolve o texto se foi mesmo escrito (difere do que veio desenhado); uma
    // caixa que só tinha o cursor fica com o valor novo.
    const dirty = sel && el.value !== el.defaultValue;
    if (sel){ typed = el.value; try { start = el.selectionStart; end = el.selectionEnd; } catch (e) {} }
    const out = fn.apply(this, args);
    if (sel && !el.isConnected){
      const again = document.querySelector(sel);
      if (again){
        if (dirty) again.value = typed;
        again.focus({preventScroll: true});
        try { if (start != null) again.setSelectionRange(start, end); } catch (e) {}
      }
    }
    return out;
  };
}

/* A ordem das secções fica guardada (definições, category_order) em vez de sair
   das posições das linhas: várias secções tinham linhas na posição 0 e, ao
   acrescentar ou tirar uma linha, o desempate mudava e a secção saltava na
   lista. Uma secção nova entra no fim. */
const SECTION_SORTS = {manual: 'Manual (arrastar)', name: 'Nome (A-Z)', count: 'Nº de linhas', amount: 'Valor'};
function sectionSort(){ return SECTION_SORTS[S.settings.category_sort] ? S.settings.category_sort : 'manual'; }
// groups = {secção: [linhas]}; valueOf dá o valor de uma linha (para ordenar por valor).
function orderedCategories(groups, valueOf){
  const names = Object.keys(groups);
  const order = Array.isArray(S.settings.category_order) ? [...S.settings.category_order] : [];
  const fresh = names.filter(n => !order.includes(n));
  if (fresh.length){
    order.push(...fresh);
    S.settings.category_order = order;
    api('PATCH', '/api/settings', {category_order: order}).catch(() => {});
  }
  const manual = (a, b) => order.indexOf(a) - order.indexOf(b);
  const total = c => groups[c].reduce((t, it) => t + (Number(valueOf(it)) || 0), 0);
  const by = {
    manual,
    name: (a, b) => a.localeCompare(b, 'pt'),
    count: (a, b) => groups[b].length - groups[a].length || manual(a, b),
    amount: (a, b) => total(b) - total(a) || manual(a, b),
  }[sectionSort()];
  return names.sort(by);
}
function sectionSortSelect(id){
  return `<label class="row small" style="gap:6px;min-height:auto">ordenar
    <select id="${id}" style="width:auto;min-height:32px;padding:4px 8px">${Object.entries(SECTION_SORTS).map(([k, v]) =>
      `<option value="${k}" ${k === sectionSort() ? 'selected' : ''}>${v}</option>`).join('')}</select></label>`;
}
function wireSectionSort(select){
  if (select) select.onchange = async e => {
    S.settings.category_sort = e.target.value;

    try { await api('PATCH', '/api/settings', {category_sort: e.target.value}); } catch (err) {}

/* Arrastar secções (só em «Manual»), pela pega do cabeçalho. As linhas têm o
   seu próprio arrastar dentro de cada secção; este só mexe nas secções. */
function wireSectionDrag(container){
  if (!container || sectionSort() !== 'manual') return;
  const groups = () => [...container.querySelectorAll(':scope > .cat-group')];
  let dragging = null;
  const save = () => {
    const shown = groups().map(g => g.dataset.cat);
    const order = [...shown, ...(S.settings.category_order || []).filter(c => !shown.includes(c))];
    S.settings.category_order = order;
    api('PATCH', '/api/settings', {category_order: order}).catch(() => {});
  };
  groups().forEach(g => {
    const handle = g.querySelector('.cat-drag');
    if (!handle) return;
    handle.addEventListener('mousedown', () => { g.draggable = true; });
    handle.addEventListener('mouseup', () => { g.draggable = false; });
    handle.addEventListener('touchstart', () => { g.draggable = true; }, {passive: true});
    g.addEventListener('dragstart', e => { if (e.target !== g) return; dragging = g; setTimeout(() => g.classList.add('dragging'), 0); });
    g.addEventListener('dragend', e => {
      if (e.target !== g) return;
      g.classList.remove('dragging'); g.draggable = false;
      if (dragging === g){ dragging = null; save(); }
    });
  });
  container.addEventListener('dragover', e => {
    if (!dragging) return;
    e.preventDefault();
    const t = e.target.closest('.cat-group');
    if (!t || t === dragging || t.parentNode !== container) return;
    const r = t.getBoundingClientRect();
    container.insertBefore(dragging, e.clientY < r.top + r.height / 2 ? t : t.nextSibling);
  });
}

// --------------------------------------------------------------- movimentos --
/* Os movimentos do mês por ordem: o que entra, o que se paga, o que se transfere
   e para onde, o que se põe de parte e o que fica livre. Cada passo marca-se como
   feito; a marca fica na DB, no mês (m.moves_done), e o Bolso vê as mesmas. */
const movesDone = m => m.moves_done || (m.moves_done = {});
async function setMoveDone(m, key, on){
  m.moves_done = (await api('POST', `/api/months/${m.id}/moves`, {key, done: on})).moves_done;
}
// Marcas antigas, guardadas só neste browser (rumo.moves.<id>), sobem para a DB uma vez.
async function liftLocalMoves(){
  let moved = false;
  for (const m of S.months){
    const k = 'rumo.moves.' + m.id;
    let old = null;
    try { old = JSON.parse(localStorage.getItem(k)); } catch (e) {}
    if (!old) continue;
    for (const key of Object.keys(old)) if (!movesDone(m)[key]){ await setMoveDone(m, key, true); moved = true; }
    try { localStorage.removeItem(k); } catch (e) {}
  }
  return moved;
}
// Copiar o valor para colar na app do banco (o clipboard moderno só existe em HTTPS).
function copyText(text){
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
  const t = document.createElement('textarea');
  t.value = text; t.style.position = 'fixed'; t.style.opacity = '0';
  document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove();
  return Promise.resolve();
}

// Abre o separador e desce até à caixa (e realça-a), para corrigir o valor na origem.
function goToSource(tab, sel){
  showTab(tab, true);
  saveView({tab});
  requestAnimationFrame(() => {
    const el = document.querySelector(sel);
    if (!el){ window.scrollTo({top: 0}); return; }
    el.scrollIntoView({block: 'center', behavior: 'smooth'});
    el.classList.add('flash');
    if (el.matches('input,select,textarea')) el.focus({preventScroll: true});
    setTimeout(() => el.classList.add('flash-out'), 1400);
    setTimeout(() => el.classList.remove('flash', 'flash-out'), 2700);
  });
}

// ------------------------------------------------------------ ajuste da IA --
/* «IA ajusta»: a IA lê os números (e as manchetes, nos investimentos) e muda as % dos
   cofres ou das categorias sem cadeado. O relatório fica por baixo da grelha, com o
   porquê de cada mudança e um «Desfazer» que volta às % de antes. */
function rebalanceHtml(kind){
  if (S.rebalancing === kind) return '<div class="card rebal"><b>A IA está a ler os números e a pensar…</b><div class="sub">pode demorar um minuto</div></div>';
  const r = S.settings['last_rebalance_' + kind];
  if (!r || !r.after) return '';
  const rows = Object.keys(r.after).map(id => {
    const before = (r.before[id] || 0) * 100, after = (r.after[id] || 0) * 100, d = after - before;
    const locked = (r.locked || []).map(String).includes(String(id));
    const fixed = (r.fixed || []).map(String).includes(String(id));
    return `<tr><td>${fixed ? '📌 ' : locked ? '🔒 ' : ''}${escAttr(r.names[id] || id)}</td><td class="n">${before.toFixed(1)}%</td>
      <td class="n">${after.toFixed(1)}%</td><td class="n ${d > 0.05 ? 'up' : d < -0.05 ? 'down' : ''}">${Math.abs(d) < 0.05 ? '=' : (d > 0 ? '+' : '') + d.toFixed(1)}</td>
      <td>${escAttr(fixed ? 'fixo' : locked ? 'bloqueado' : (r.reasons[id] || (Math.abs(d) < 0.05 ? 'sem razão para mudar' : 'acerto para a soma dar 100%')))}</td></tr>`;
  }).join('');
  const when = new Date(r.at * 1000).toLocaleString('pt-PT', {dateStyle: 'short', timeStyle: 'short'});
  return `<div class="card rebal">
    <div class="flexrow"><h2 style="margin:0">Ajuste da IA <span class="sub" style="font-weight:400">· ${when} · ${escAttr(r.provider || '')}</span></h2>
      ${r.undone ? '<span class="pill">desfeito</span>' : `<button class="small" data-undo="${kind}">Desfazer</button>`}</div>
    ${r.text ? `<div style="margin-top:8px">${escAttr(r.text)}</div>` : ''}
    <table><thead><tr><th>${kind === 'pot' ? 'Cofre' : 'Categoria'}</th><th>antes</th><th>depois</th><th>±</th><th>porquê</th></tr></thead><tbody>${rows}</tbody></table>
  </div>`;
}
function wireRebalance(kind, m){
  const btn = $(kind === 'pot' ? '#btnAiPots' : '#btnAiInv');
  const repaint = () => (kind === 'pot' ? renderPotsTab() : renderInvestTab());

}

function renderMovesTab(){
  const el = $('#tab-moves');
  const m = curMonth();
  if (!m){ el.innerHTML = '<div class="card">Cria um mês primeiro.</div>'; return; }
  const accS = accLabel('S'), accR = transferOn() ? accLabel('R') : accLabel('S'), accJ = jointName(), from = jointFrom();
  const jointMe = Number(m.joint_transfer_total) || 0;
  const lines = (filter) => m.expenses.filter(filter).map(e => [e.name, e.planned, e.id]).filter(([, v]) => v);
  const own = acc => lines(e => !isIncomeCat(e.category) && !e.joint_account && e.account === acc);
  const gains = acc => lines(e => isIncomeCat(e.category) && e.account === acc);
  const sum = arr => arr.reduce((a, [, v]) => a + v, 0);
  const detail = (label, arr) => arr.length ? `<details><summary>${label}</summary><div class="move-lines">${
    arr.map(([n, v, id]) => {
      const name = `${emojiFor('item', n)} ${escAttr(n)}`;
      return (id ? `<a data-tab="month" data-sel='#tab-month .item-row[data-id="${id}"]'>${name}</a>` : `<span>${name}</span>`) + `<b>${eur(v)}</b>`;
    }).join('')}</div></details>` : '';
  const holdingsOf = inv => S.holdings.filter(h => h.investment_id === inv.id)
    .map(h => escAttr(h.ticker || h.name)).filter(Boolean);

  const steps = [];
  // go = [separador, seletor da caixa de onde vem o valor]
  const add = (group, key, title, route, amount, extra = '', go = null) => steps.push({group, key, title, route, amount, extra, go});
  const inS = [['Ordenado', m.ordenado], ['Extras', m.extras], ['Fatia', m.fatia_income || 0], ...gains('S')].filter(([, v]) => v);
  add('Entradas', 'in-S', `Confirmar o que entrou na ${accS}`, [`→ ${accS}`], sum(inS),
      detail('de onde vem', inS) + (m.santander_anterior ? `<div class="sub">já lá estavam ${eur(m.santander_anterior)} do mês anterior</div>` : ''), ['month', '#f-ordenado']);
  if (sum(gains('R')) > 0) add('Entradas', 'in-R', `Confirmar o que entrou na ${accR}`, [`→ ${accR}`], sum(gains('R')), detail('de onde vem', gains('R')), ['month', `#tab-month .cat-group[data-cat="${CSS.escape((m.expenses.find(e => isIncomeCat(e.category)) || {}).category || 'LUCROS')}"]`]);
  if (sum(own('S')) > 0) add('Pagar', 'pay-S', `Pagar as despesas da ${accS}`, [accS, '→ despesas'], sum(own('S')), detail('o que se paga', own('S')), ['month', '#catListMonth']);
  if (jointOn() && jointMe > 0){
    const house = lines(e => e.joint_account && !isIncomeCat(e.category));
    add('Transferir', 'joint', `A tua parte da casa para a ${accJ}`, [accLabel(from), '→', accJ], jointMe,
        detail(`despesas da casa (${eur(m.joint_expenses_total)}; a tua parte ${pct(m.joint_share)})`, house)
        + `<div class="sub">${m.joint_extra ? `inclui ${eur(m.joint_extra)} a mais (cada um) · ` : ''}${partnerName()} põe ${eur(m.joint_partner_actual ?? m.joint_partner_predicted ?? 0)}</div>`, ['month', '#f-joint-me']);
  }
  if (transferOn() && m.trf_revolut > 0) add('Transferir', 'trf-R', `Passar para a ${accR}`, [accS, '→', accR], m.trf_revolut,
      `<div class="sub">${pct(m.pct_revolut)} do que sobra na ${accS} depois das despesas</div>`, ['month', '#f-pctrevolut']);
  if (sum(own('R')) > 0) add('Pagar', 'pay-R', `Pagar as despesas da ${accR}`, [accR, '→ despesas'], sum(own('R')), detail('o que se paga', own('R')), ['month', '#catListMonth']);
  if (!m.no_savings){
    if (m.geral_this_month > 0) add('Pôr de parte', 'geral', 'Poupança Geral', [accR, '→', 'Geral'], m.geral_this_month,
        `<div class="sub">${pct(m.split_geral)} da poupança do mês, mais o que sobra dos arredondamentos</div>`, ['pots', '#f-split-geral']);
    m.pots.filter(p => p.active && p.contributed_this_month > 0).forEach(p =>
      add('Pôr de parte', 'pot-' + p.id, `${emojiFor('pot', p.name, '💰')} Cofre «${escAttr(p.name)}»`, [accR, '→', 'cofre ' + escAttr(p.name)],
          p.contributed_this_month, `<div class="sub">fica com ${eur(p.accumulated)}</div>`, ['pots', `#potsGrid .potcard[data-id="${p.id}"]`]));
    (m.investimentos || []).filter(i => i.active && i.contributed_this_month > 0).forEach(i => {
      const where = holdingsOf(i);
      add('Investir', 'inv-' + i.id, `${emojiFor('inv', i.name, '📊')} Investir em «${escAttr(i.name)}»`, [accR, '→', escAttr(i.name)],
          i.contributed_this_month, where.length ? `<div class="sub">posições: ${where.join(', ')}</div>` : '', ['invest', `#invGrid .potcard[data-id="${i.id}"]`]);
    });
  }

  const done = movesDone(m);
  const count = steps.filter(st => done[st.key]).length;
  let group = '';
  const html = steps.map((st, i) => {
    const tone = MOVE_TONES[st.group] || 'var(--dim)';
    const head = st.group !== group ? `<div class="move-group" style="--tone:${tone}">${(group = st.group)}</div>` : '';
    return `${head}<div class="move${done[st.key] ? ' done' : ''}" data-key="${st.key}" style="--tone:${tone}">
      <div class="num">${done[st.key] ? '✓' : i + 1}</div>
      <div><div class="move-title">${st.go ? `<a class="move-go" data-tab="${st.go[0]}" data-sel='${st.go[1]}' title="abrir onde este valor se muda">${st.title}<span class="move-fix" aria-hidden="true">↗</span></a>` : st.title}</div>
        <div class="move-route">${st.route.map(r => r.startsWith('→') ? `<span>${r}</span>` : `<b>${r}</b>`).join(' ')}</div>${st.extra}</div>
      <div class="move-side"><div class="move-amt">${eur(st.amount)}</div>
        <button class="small ghost f-copy" data-v="${st.amount.toFixed(2).replace('.', ',')}" title="copiar o valor">copiar</button>
        <button class="small f-done">${done[st.key] ? 'desfazer' : 'feito'}</button></div>
    </div>`;
  }).join('');
  const free = (m.cc_livre || 0) + (m.livre_resto || 0);
  el.innerHTML = `
    <div class="card">
      <div class="flexrow"><h2 style="margin:0">Movimentos de ${m.month_name} ${m.year}</h2>
        <span class="pill ${count === steps.length && steps.length ? 'good' : ''}">${count} de ${steps.length} feitos</span></div>
      <div class="sub" style="margin-top:6px">Por esta ordem, com os valores do mês (separadores Mês, Poupanças e Investir). «feito» fica guardado no mês e aparece igual no Bolso.</div>
    </div>
    <div class="section-gap">${html || '<div class="sub">sem movimentos este mês</div>'}</div>
    <div class="card section-gap">
      <h2 style="margin:0 0 6px">Fica livre para gastar: ${eur(free)}</h2>
      <div class="sub">${transferOn() ? `${accS} ${eur(m.cc_livre || 0)} · ${accR} ${eur(m.livre_resto || 0)}` : 'depois de pagar tudo e de pôr a poupança de parte'}${m.no_savings ? ' · mês marcado sem poupança' : ''}</div>
    </div>`;
  $$('[data-sel]', el).forEach(a => a.onclick = e => { e.preventDefault(); goToSource(a.dataset.tab, a.dataset.sel); });
  $$('.move', el).forEach(card => {
    card.querySelector('.f-done').onclick = () => setMoveDone(m, card.dataset.key, !done[card.dataset.key]).then(renderMovesTab, () => {});
    const cp = card.querySelector('.f-copy');
    cp.onclick = () => copyText(cp.dataset.v).then(() => { cp.textContent = 'copiado'; setTimeout(() => { cp.textContent = 'copiar'; }, 1200); });
  });
}

// --------------------------------------------------------- chart helpers --
function sparklinePath(values, w, h, pad=4){
  if (!values.length) return {line:'', area:''};
  const min = Math.min(...values, 0), max = Math.max(...values, 1);
  const range = (max-min) || 1;
  const step = (w - pad*2) / Math.max(1, values.length-1);
  const pts = values.map((v,i) => [pad + i*step, h - pad - ((v-min)/range)*(h-pad*2)]);
  const line = pts.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area = line + ` L${pts[pts.length-1][0].toFixed(1)},${h-pad} L${pts[0][0].toFixed(1)},${h-pad} Z`;
  return {line, area, pts};
}

const CHARTS = new Map(); let chartSeq = 0;
const compact = v => Math.abs(v) >= 1000 ? (v/1000).toFixed(1).replace('.0','') + 'k' : Math.abs(v) < 10 ? v.toFixed(1).replace('.0','') : String(Math.round(v));
function lineChart(labels, series, opts={}){
  const w = opts.w || 640, h = opts.h || 200, padL = 40, padR = 14, padT = 12, padB = 26;
  const allVals = series.flatMap(s=>s.values);
  const min = Math.min(0, ...allVals), max = Math.max(1, ...allVals);
  const range = (max-min) || 1;
  const n = labels.length;
  const stepX = (w - padL - padR) / Math.max(1, n-1);
  const x = i => padL + i*stepX;
  const y = v => h - padB - ((v-min)/range)*(h-padT-padB);
  let gridLines = '';
  for (let g=0; g<=4; g++){
    const gy = padT + g*(h-padT-padB)/4;
    const val = max - g*range/4;
    gridLines += `<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${w-padR}" y2="${gy.toFixed(1)}" stroke="var(--line)" stroke-width="1"${min < 0 && Math.abs(val) < range/8 ? ' stroke-dasharray="4 3"' : ''}/>`
      + `<text x="${padL-6}" y="${(gy+3).toFixed(1)}" font-size="9" fill="var(--dim)" text-anchor="end">${compact(val)}</text>`;
  }
  let paths = '';
  series.forEach(s => {
    const pts = s.values.map((v,i)=>[x(i), y(v)]);
    const d = pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
    paths += `<path class="lp" pathLength="1" d="${d}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
    if (n <= 40) pts.forEach(p => paths += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6" fill="${s.color}"/>`);
    const l = pts[pts.length-1];
    if (l) paths += `<circle cx="${l[0].toFixed(1)}" cy="${l[1].toFixed(1)}" r="4.5" fill="${s.color}" stroke="var(--panel)" stroke-width="2"/>`;
  });
  let labelsSvg = '';
  labels.forEach((l,i) => {
    if (n > 8 && i % 2 !== 0 && i !== n-1) return;
    labelsSvg += `<text x="${x(i).toFixed(1)}" y="${h-8}" font-size="9.5" fill="var(--dim)" text-anchor="middle">${l}</text>`;
  });
  const id = 'c' + (++chartSeq);
  CHARTS.set(id, {labels: opts.tipLabels || labels, series, w, n, padL, stepX, x, y});
  if (CHARTS.size > 24) CHARTS.delete(CHARTS.keys().next().value);
  return `<svg class="barchart" data-cid="${id}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">${gridLines}${paths}${labelsSvg}<line class="cguide" x1="0" x2="0" y1="${padT}" y2="${h-padB}" stroke="var(--dim)" stroke-width="1" stroke-dasharray="3 3" opacity="0"/></svg>`;
}
// Cartão de informação: qualquer elemento com data-tip (HTML) mostra-o ao passar o rato ou ao tocar.
const tipRows = (title, rows, foot, color) =>
  `<div class="tt">${color ? `<i style="background:${color}"></i>` : ''}${escAttr(title)}</div>`
  + rows.filter(Boolean).map(([k, v]) => `<div class="tr"><span>${k}</span><b>${v}</b></div>`).join('')
  + (foot ? `<div class="tf">${foot}</div>` : '');
const tipAttr = html => ` data-tip="${escAttr(html)}"`;
if (!window.__rumoTip){
  window.__rumoTip = true;
  const tip = document.createElement('div'); tip.id = 'charttip'; document.body.appendChild(tip);
  const hide = () => { tip.classList.remove('on'); document.querySelectorAll('.cguide').forEach(g => g.setAttribute('opacity', 0)); };
  const place = e => {
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    tip.style.left = Math.max(8, Math.min(window.innerWidth - tw - 8, e.clientX + 14)) + 'px';
    tip.style.top = Math.max(8, Math.min(window.innerHeight - th - 8, e.clientY - th - 12 < 8 ? e.clientY + 16 : e.clientY - th - 12)) + 'px';
  };
  const show = e => {
    const t = e.target.closest && e.target.closest('[data-tip]');
    if (t){
      tip.innerHTML = t.dataset.tip; tip.classList.add('on'); place(e);
      document.querySelectorAll('.cguide').forEach(g => g.setAttribute('opacity', 0));
      return;
    }
    const svg = e.target.closest && e.target.closest('svg[data-cid]');
    const c = svg && CHARTS.get(svg.dataset.cid);
    if (!c) return hide();
    const r = svg.getBoundingClientRect();
    const i = Math.max(0, Math.min(c.n-1, Math.round(((e.clientX - r.left) / r.width * c.w - c.padL) / c.stepX)));
    const g = svg.querySelector('.cguide'); g.setAttribute('x1', c.x(i)); g.setAttribute('x2', c.x(i)); g.setAttribute('opacity', .7);
    tip.innerHTML = `<div class="tl">${c.labels[i] || ''}</div>` + c.series.map(sr =>
      `<div><i style="background:${sr.color}"></i>${sr.name ? sr.name + ' · ' : ''}<b>${eur(sr.values[i])}</b></div>`).join('');
    tip.classList.add('on'); place(e);
  };
  document.addEventListener('pointermove', show);
  document.addEventListener('pointerdown', show);   // no telemóvel: tocar mostra, tocar fora esconde
  document.addEventListener('pointerleave', hide); document.addEventListener('scroll', hide, true);
}

function donut(segments, opts={}){
  const size = opts.size || 140, stroke = opts.stroke || 20;
  const r = (size - stroke)/2, c = size/2;
  const circumf = 2*Math.PI*r;
  let offset = 0, paths = '';
  const total = segments.reduce((a,s)=>a+s.value,0) || 1;
  segments.forEach(s => {
    const frac = s.value/total;
    const len = frac*circumf;
    paths += `<circle class="seg"${s.tip ? tipAttr(s.tip) : ''} style="--circ:${circumf.toFixed(2)}" cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${s.color}" stroke-width="${stroke}"
      stroke-dasharray="${len.toFixed(2)} ${(circumf-len).toFixed(2)}" stroke-dashoffset="${(-offset).toFixed(2)}" transform="rotate(-90 ${c} ${c})"/>`;
    offset += len;
  });
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${paths}</svg>`;
}

function deltaSpan(cur, prev, higherIsBetter=true){
  if (prev == null || prev === 0) return '<span class="delta flat">—</span>';
  const diff = cur - prev;
  const p = (diff/Math.abs(prev))*100;
  const good = higherIsBetter ? diff >= 0 : diff <= 0;
  const arrow = diff >= 0 ? '▲' : '▼';
  // Em percentagem, um mês a meio ou com valores pequenos dá números sem sentido (+973%): a diferença em € vai à frente.
  const pc = Math.abs(p) < 150 ? ` (${diff>=0?'+':'−'}${Math.abs(p).toFixed(0)}%)` : '';
  return `<span class="delta ${good?'up':'down'}">${arrow} ${eur(Math.abs(diff))}${pc} vs mês anterior</span>`;
}

// Thin a long series down to something a 640px chart can draw: labels only every
// fourth point, and on even indices so lineChart's own thinning keeps them.
function downsample(labels, values, target=25){
  if (values.length <= target) return {labels, values};
  const step = (values.length - 1) / (target - 1);
  const l = [], v = [];
  for (let k = 0; k < target; k++){
    const i = Math.round(k * step);
    l.push(labels[i]); v.push(values[i]);
  }
  return {labels: l, values: v};
}

const PERF_RANGES = {'1mo': '1 mês', '6mo': '6 meses', '1y': '1 ano'};

function investmentStats(){
  let value = 0, quoted = 0, cost = 0, dayNow = 0, dayPrev = 0;
  const byCat = {}, scored = [];
  S.holdings.forEach(h => {
    const pi = h.price_info;
    const cat = h.investment_name || '—';
    if (pi && pi.manual){
      value += h.current_value || 0;
      byCat[cat] = (byCat[cat] || 0) + (h.current_value || 0);
      return;
    }
    if (!pi || !pi.ok) return;
    value += h.current_value; quoted += h.current_value; cost += h.cost_basis;
    byCat[cat] = (byCat[cat] || 0) + h.current_value;
    if (pi.prev_close != null){
      const prevEur = pi.prev_close * (pi.fx_rate == null ? 1 : pi.fx_rate);
      dayNow += h.current_value;
      dayPrev += prevEur * h.quantity;
    }
    if (h.cost_basis) scored.push({name: h.ticker || h.name, pct: h.gain_loss_pct, eur: h.gain_loss});
  });
  scored.sort((a, b) => b.pct - a.pct);
  return {value, quoted, cost, byCat, scored,
          dayDelta: dayNow - dayPrev,
          dayPct: dayPrev ? (dayNow / dayPrev - 1) * 100 : null};
}

function heroTip(n, v, c, sum, m){
  const why = n.startsWith('Livre') ? (transferOn() ? `${accLabel('S')} ${eur(m.cc_livre)} + ${accLabel('R')} ${eur(m.livre_resto)}` : 'O que sobra depois das despesas e da poupança.')
    : n.startsWith('Poupado') ? `Geral ${eur(m.geral_acumulado)} · cofres ${eur(m.pots.reduce((a,p)=>a+p.accumulated,0))} · investimentos ${eur(m.investimentos.reduce((a,p)=>a+p.accumulated,0))}`
    : `Saldo da conta ${eur(m.joint_account_acumulado)}, a tua parte é ${pct(m.joint_share)}`;
  return tipRows(n, [['Valor', eur(v)], ['Do património', (Math.max(0,v)/sum*100).toFixed(1) + '%']], why, c);
}

function patrimonioHero(m, prev){

  const parts = [[transferOn() ? 'Livre em conta' : 'Livre para gastar', livre, 'var(--rev)'], ['Poupado + investido', pou, 'var(--accent)'], ...(jointOn() ? [[jointName() + ' (tua parte)', cj, 'var(--gold)']] : [])];
  const sum = parts.reduce((a,[,v]) => a + Math.max(0, v), 0) || 1;

function renderInvestmentsCard(m){
  const st = investmentStats();

  }
  const gain = st.quoted - st.cost;
  const gainPct = st.cost ? (gain / st.cost) * 100 : null;
  const col = v => v >= 0 ? 'var(--good)' : 'var(--bad)';
  const sign = v => v >= 0 ? '▲' : '▼';

  const perf = S.perf[S.perfRange];
  let chart;
  if (perf === 'loading' || perf === undefined){
    chart = '<div class="sub" style="padding:26px 0;text-align:center">a carregar o histórico…</div>';

    chart = '<div class="sub" style="padding:26px 0;text-align:center">sem histórico suficiente para estas posições.</div>';
  } else {

    const labels = ds.labels.map((l, i) => i % 4 === 0 ? l : '');
    const first = perf.values[0], last = perf.values[perf.values.length-1];
    const delta = last - first, dpct = first ? (delta/first)*100 : 0;
    chart = lineChart(labels, [{values: ds.values, color: 'var(--purple)', name: 'Valor'}], {h: 190, tipLabels: ds.labels})
      + `<div class="row small" style="justify-content:space-between;margin-top:4px">
           <span class="muted">${perf.labels[0].split('-').reverse().join('/')}: ${eur(first)}</span>
           <span style="color:${col(delta)};font-weight:700">${sign(delta)} ${eur(Math.abs(delta))} (${dpct.toFixed(1)}%)</span>
         </div>`;
  }

  const catRows = m.investimentos.map(inv => {
    const val = st.byCat[inv.name] || 0;
    const actual = st.value ? (val / st.value) * 100 : 0;
    const target = (inv.pct || 0) * 100;
    return `
      <div${tipAttr(tipRows(inv.name, [['Valor', eur(val)], ['Peso real', actual.toFixed(1) + '%'], ['Alvo', target.toFixed(1) + '%'], ['Desvio', (actual-target>=0?'+':'') + (actual-target).toFixed(1) + ' p.p.']], actual > target + 3 ? 'Acima do alvo: as próximas entradas podem ir para outras categorias.' : actual < target - 3 ? 'Abaixo do alvo: boa categoria para reforçar.' : 'Perto do alvo.', 'var(--purple)'))} style="margin-bottom:10px">
        <div class="row small" style="justify-content:space-between;margin-bottom:3px">
          <span>${escAttr(inv.name)}</span>
          <span class="muted">${eur(val)} · <b>${actual.toFixed(0)}%</b> de ${target.toFixed(0)}% alvo</span>
        </div>
        <div class="progress" style="position:relative">
          <div style="width:${Math.min(100, actual).toFixed(1)}%;background:var(--purple)"></div>
          <div title="alvo ${target.toFixed(0)}%" style="position:absolute;top:-2px;bottom:-2px;left:${Math.min(100, target).toFixed(1)}%;width:2px;background:var(--txt);opacity:.75"></div>
        </div>
      </div>`;
  }).join('');

  const best = st.scored[0], worst = st.scored[st.scored.length-1];
  const movers = st.scored.length >= 2 ? `
    <div class="grid cols-2" style="gap:10px;margin-top:4px">
      <div class="metric tile"><div class="lbl">Melhor posição</div>
        <div class="val" style="font-size:15px;color:${col(best.pct)}">${escAttr(best.name)} ${best.pct.toFixed(1)}%</div>
        <span class="sub">${eur(best.eur)}</span></div>
      <div class="metric tile"><div class="lbl">Pior posição</div>
        <div class="val" style="font-size:15px;color:${col(worst.pct)}">${escAttr(worst.name)} ${worst.pct.toFixed(1)}%</div>
        <span class="sub">${eur(worst.eur)}</span></div>
    </div>` : '';

  return `
    <div class="card section-gap">
      <div class="flexrow">
        <h2 style="margin:0">Investimentos</h2>
        <div class="row" style="gap:10px"><span class="sub">${pricesAgeLabel()}</span><button id="btnGoInvestDash" class="small" onclick="document.querySelector('.tabs button[data-tab=invest]').click()">abrir Investir →</button></div>
      </div>
      ${investKpis(st)}
      <div style="margin-top:14px">${catRows || '<div class="sub">sem categorias</div>'}</div>
      <div class="sub">A barra é o peso real; o traço vertical é a tua percentagem-alvo. A evolução e as posições estão em Investir.</div>
    </div>`;
}

// O ponto de vista é o meu: uma despesa da casa conta pela minha parte dela.
function jointDashboardCard(m, prev){
  const total = m.joint_expenses_total || 0;
  const me = m.joint_transfer_total, other = m.joint_partner_contribution;
  const byCat = {};
  m.expenses.filter(e => e.joint_account && !isIncomeCat(e.category)).forEach(e => { byCat[e.category] = (byCat[e.category]||0) + e.planned; });
  const cats = Object.entries(byCat).filter(([,v]) => v > 0).sort((a,b) => b[1]-a[1]);
  const put = me + other || 1;
  return `
      <div class="card">
        <h2>🏠 ${jointName()}</h2>
        <div class="grid cols-3">
          <div class="metric tile"><div class="lbl">Casa este mês</div><div class="val">${eur(total)}</div>${prev ? deltaSpan(total, prev.joint_expenses_total, false) : ''}</div>
          <div class="metric tile"><div class="lbl">Tu (${pct(m.joint_share)})</div><div class="val" style="color:var(--blue)">${eur(me)}</div><div class="sub">${m.joint_me_actual==null?'previsto':'transferido'}</div></div>
          <div class="metric tile"><div class="lbl">${partnerName()}</div><div class="val" style="color:var(--purple)">${eur(other)}</div><div class="sub">${m.joint_partner_actual==null?'previsto':'transferido'}</div></div>
        </div>
        ${total > 0 ? `<div class="split-bar" style="margin:4px 0 10px">
            <div style="width:${(me/put*100).toFixed(1)}%;background:var(--blue)">${me/put > .15 ? 'tu' : ''}</div>
            <div style="width:${(other/put*100).toFixed(1)}%;background:var(--purple)">${other/put > .15 ? escAttr((S.settings.joint_partner_name||'').split(' ')[0] || 'ela') : ''}</div></div>` : ''}
        <div class="row small" style="justify-content:space-between"><span class="muted">Saldo da conta</span><b style="color:var(--accent)">${eur(m.joint_account_acumulado)}</b></div>
        ${cats.length ? cats.slice(0,6).map(([c,v]) => `<div class="row small" style="justify-content:space-between;margin-top:4px"><span>${escAttr(c)}</span><span class="muted">${eur(v)}</span></div>`).join('')
          : `<div class="sub" style="margin-top:10px">Sem despesas da casa neste mês. No separador Mês, escolhe «🏠 ${jointName()}» como conta de uma despesa.</div>`}
      </div>`;
}

function renderCategoryChart(m){
  const byCat = {};
  m.expenses.filter(e => !isIncomeCat(e.category)).forEach(e => { byCat[e.category] = (byCat[e.category]||0) + (e.joint_account ? e.planned * m.joint_share : e.planned); });
  let entries = Object.entries(byCat).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  if (!entries.length) return '<div class="sub">sem despesas este mês</div>';
  // Queijo: 8 fatias no máximo, o resto junta-se em «Outras» para o total bater certo.
  if (entries.length > 9) entries = [...entries.slice(0,8), ['Outras', entries.slice(8).reduce((a,e)=>a+e[1],0)]];
  const total = entries.reduce((a,e)=>a+e[1],0);
  const segs = entries.map(([c,v],i) => {
    const items = m.expenses.filter(x => x.category === c && x.planned > 0).sort((a,b) => b.planned - a.planned);
    const top = items.slice(0,4).map(x => [escAttr(x.name) + (x.joint_account ? ' 🏠' : ''), eur(x.joint_account ? x.planned*m.joint_share : x.planned)]);
    return {name:c, value:v, color:CAT_COLORS[i % CAT_COLORS.length],
      tip: tipRows(c, [['Este mês', eur(v)], ['Das despesas', Math.round(v/total*100) + '%'], ...top], items.length > 4 ? `+ ${items.length-4} linhas` : '', CAT_COLORS[i % CAT_COLORS.length])};
  });
  return `<div class="row" style="gap:20px;align-items:center">
    ${donut(segs, {size:150, stroke:75})}
    <div class="small" style="flex:1;min-width:180px">${segs.map(s => `
      <div class="row" style="justify-content:space-between;gap:8px;flex-wrap:nowrap;margin-bottom:5px">
        <span><span style="color:${s.color}">●</span> ${emojiFor('cat', s.name)} ${escAttr(s.name)}</span>
        <span style="white-space:nowrap">${eur(s.value)} <span class="muted">${Math.round(s.value/total*100)}%</span></span>
      </div>`).join('')}
    </div>
  </div>`;
}

let monthQuery = '';
const fold = t => String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function applyMonthSearch(){
  const root = $('#catListMonth'); if (!root) return;
  const q = fold(monthQuery).trim();
  let shown = 0, total = 0;
  $$('.cat-group', root).forEach(g => {
    const catHit = q && fold(g.dataset.cat).includes(q);
    let any = false;
    $$('.item-row', g).forEach(r => {
      total++;
      const acc = r.querySelector('.f-account');
      const txt = fold([r.querySelector('.f-name').value, r.querySelector('.f-obs').value, r.querySelector('.f-planned').value, acc && acc.options[acc.selectedIndex]?.text].join(' '));
      const hit = !q || catHit || txt.includes(q);
      r.hidden = !hit; if (hit){ any = true; shown++; }
    });
    g.hidden = !any;
  });
  const info = $('#monthSearchInfo');
  if (info){ info.hidden = !q; info.textContent = shown ? `${shown} de ${total} linhas` : 'nada encontrado'; }
}
function wireMonthSearch(){
  const inp = $('#monthSearch'); if (!inp) return;
  inp.oninput = () => { monthQuery = inp.value; applyMonthSearch(); };
  inp.onkeydown = e => {
    if (e.key === 'Escape'){ inp.value = monthQuery = ''; applyMonthSearch(); inp.blur(); }
    if (e.key === 'Enter'){ const f = $$('#catListMonth .item-row:not([hidden]) .f-planned:not([readonly])')[0]; if (f){ f.focus(); f.select(); } }
  };
  applyMonthSearch();
}
if (!window.__rumoSlash){
  window.__rumoSlash = true;
  document.addEventListener('keydown', e => {
    if (e.key !== '/' || e.ctrlKey || e.metaKey || e.altKey || /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName)) return;
    const inp = $('#monthSearch');
    if (inp && inp.offsetParent){ e.preventDefault(); inp.focus(); inp.select(); }
  });
  document.addEventListener('change', e => { if (e.target.matches?.('select.f-account')) e.target.dataset.v = e.target.value; });
}

function jointName(){ return escAttr(S.settings.joint_account_name || 'Conta Conjunta'); }
function partnerName(){ return escAttr(S.settings.joint_partner_name || 'Parceiro(a)'); }
function jointFrom(){ return S.settings.joint_from_account === 'R' ? 'R' : 'S'; }
// A pergunta «de onde sai esta despesa?» tem três respostas: das minhas duas
// contas, ou da conta da casa (que eu e o(a) parceiro(a) enchemos).
function accountOptions(it){
  const joint = !!it.joint_account && jointOn();
  const acct = transferOn() ? it.account : 'S';
  return `<option value="S" ${!joint && acct==='S'?'selected':''}>${accLabel('S')}</option>
    ${transferOn() ? `<option value="R" ${!joint && acct==='R'?'selected':''}>${accLabel('R')}</option>` : ''}
    ${!jointOn() || (it.external_source === 'giro' && !joint) ? '' : `<option value="J" ${joint?'selected':''}>🏠 ${jointName()}</option>`}`;
}
const accChoice = () => transferOn() || jointOn();   // só há onde escolher se existir mais de uma «conta»
function accountPatch(v){ return v === 'J' ? {joint_account: true} : {account: v, joint_account: false}; }

function jointMonthCard(m){
  if (!jointOn()) return '';
  const lines = m.expenses.filter(e => e.joint_account);
  const ruleShare = S.settings.joint_split_mode === 'income' ? 'pela proporção dos ordenados' : `${pct(S.settings.joint_my_share ?? 0.5)} pela regra`;
  const start = m.joint_balance_start, end = m.joint_account_acumulado;
  let minNote = '';
  if (m.joint_expenses_total > 0 && start > 0.005){
    minNote = start >= m.joint_expenses_total
      ? `A conta começa o mês com ${eur(start)}, que já chega para as despesas da casa.`
      : `Contando com os ${eur(start)} que já lá estão, o mínimo este mês é ${eur(m.joint_me_min)} teus + ${eur(m.joint_partner_min)} de ${partnerName()}.`;
  } else if (start < -0.005){
    minNote = `A conta começa o mês a descoberto (${eur(start)}): para cobrir tudo são precisos ${eur(m.joint_me_min)} teus + ${eur(m.joint_partner_min)} de ${partnerName()}.`;

function mdInline(s){
  return s
    .replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`)
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/(^|[^*\w])\*([^*\n]+)\*/g, '$1<i>$2</i>')
    .replace(/(^|[\s(])_([^_\n]+)_(?=[\s.,;:)]|$)/g, '$1<i>$2</i>')
    // Only http(s) becomes a link -- never javascript: from model output.
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}

function mdTable(rows){
  const cells = r => r.replace(/^\||\|$/g, '').split('|').map(c => c.trim());
  const head = cells(rows[0]);
  const align = cells(rows[1]).map(c => /^:?-+:$/.test(c) || /-:$/.test(c) ? 'num' : '');
  const body = rows.slice(2).map(r => cells(r));
  const th = head.map((c, i) => `<th class="${align[i]||''}">${mdInline(c)}</th>`).join('');
  const tr = body.map(r => '<tr>' + r.map((c, i) =>
    `<td class="${align[i]||''}">${mdInline(c)}</td>`).join('') + '</tr>').join('');
  return `<div class="tablewrap"><table><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table></div>`;
}

function renderMarkdown(text){
  const lines = escAttr(String(text ?? '')).replace(/\r/g, '').split('\n');
  const out = [];
  let para = [], list = null, quote = [], fence = null;

  const flushPara = () => { if (para.length){ out.push(`<p>${mdInline(para.join(' '))}</p>`); para = []; } };
  const flushList = () => { if (list){ out.push(`<${list.tag}>${list.items.map(i => `<li>${mdInline(i)}</li>`).join('')}</${list.tag}>`); list = null; } };
  const flushQuote = () => { if (quote.length){ out.push(`<blockquote>${mdInline(quote.join(' '))}</blockquote>`); quote = []; } };
  const flushAll = () => { flushPara(); flushList(); flushQuote(); };

  for (let i = 0; i < lines.length; i++){
    const line = lines[i];

    if (fence !== null){
      if (/^\s*```/.test(line)){ out.push(`<pre><code>${fence.join('\n')}</code></pre>`); fence = null; }
      else fence.push(line);
      continue;
    }
    if (/^\s*```/.test(line)){ flushAll(); fence = []; continue; }

    if (!line.trim()){ flushAll(); continue; }

    // A pipe table needs its separator row to be a table at all.
    if (line.includes('|') && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i+1] || '')){
      flushAll();
      const rows = [];
      while (i < lines.length && lines[i].includes('|')) rows.push(lines[i++].trim());
      i--;
      if (rows.length >= 2){ out.push(mdTable(rows)); continue; }
    }

    let mm;
    if ((mm = line.match(/^\s{0,3}(#{1,6})\s+(.*)$/))){
      flushAll();
      const lvl = Math.min(4, mm[1].length);
      out.push(`<h${lvl}>${mdInline(mm[2].replace(/\s*#+\s*$/, ''))}</h${lvl}>`);
      continue;
    }
    if (/^\s{0,3}([-*_])\s*\1\s*\1[-*_\s]*$/.test(line)){ flushAll(); out.push('<hr>'); continue; }
    if ((mm = line.match(/^\s*>\s?(.*)$/))){ flushPara(); flushList(); quote.push(mm[1]); continue; }
    if ((mm = line.match(/^\s*[-*+]\s+(.*)$/))){
      flushPara(); flushQuote();
      if (!list || list.tag !== 'ul'){ flushList(); list = {tag: 'ul', items: []}; }
      list.items.push(mm[1]); continue;
    }
    if ((mm = line.match(/^\s*\d+[.)]\s+(.*)$/))){
      flushPara(); flushQuote();
      if (!list || list.tag !== 'ol'){ flushList(); list = {tag: 'ol', items: []}; }
      list.items.push(mm[1]); continue;
    }
    // A continuation line belongs to whatever block is open.
    if (list){ list.items[list.items.length-1] += ' ' + line.trim(); continue; }
    if (quote.length){ quote.push(line.trim()); continue; }
    para.push(line.trim());
  }
  if (fence !== null) out.push(`<pre><code>${fence.join('\n')}</code></pre>`);
  flushAll();
  return out.join('');
}

// Duplo clique, toque duplo ou premir (rato, ecrã tátil): abre a edição de um valor.
function onEditGesture(el, fn){
  let timer = null, last = 0;
  const cancel = () => { if (timer){ clearTimeout(timer); timer = null; } };
  el.addEventListener('dblclick', e => { e.preventDefault(); fn(); });
  el.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') timer = setTimeout(() => { timer = null; fn(); }, 520); });
  el.addEventListener('pointerup', e => {
    cancel(); if (e.pointerType === 'mouse') return;
    const t = Date.now(); if (t - last < 350){ last = 0; fn(); } else last = t;
  });
  el.addEventListener('pointermove', cancel); el.addEventListener('pointercancel', cancel);
}
const fmtPct = p => String(Math.round((Number(p) || 0) * 1000) / 10).replace('.', ',');
// Percentagem e valor lado a lado, os dois escrevíveis: mexer num acerta o outro e o cursor.
function dualBox(key, p, base){
  return `<div class="dual" data-key="${key}" data-base="${Number(base) || 0}">
    <label class="dbox"><input id="n-pct-${key}" type="text" inputmode="decimal" value="${fmtPct(p)}" aria-label="percentagem"><span>%</span></label>
    <span class="dsep">=</span>
    <label class="dbox"><input id="n-eur-${key}" type="text" inputmode="decimal" value="${((Number(p) || 0) * (Number(base) || 0)).toFixed(2)}" aria-label="valor"><span>${curSym(CURRENCY)}</span></label></div>`;
}
function syncDual(key, v){
  const box = $(`.dual[data-key="${key}"]`); if (!box) return;
  const np = $(`#n-pct-${key}`), ne = $(`#n-eur-${key}`);
  if (document.activeElement !== np) np.value = fmtPct(v);
  if (document.activeElement !== ne) ne.value = (v * (Number(box.dataset.base) || 0)).toFixed(2);
}
function wireDual(key, rangeSel){
  const range = $(rangeSel), box = $(`.dual[data-key="${key}"]`); if (!range || !box) return;
  const base = Number(box.dataset.base) || 0;
  const apply = v => { range.value = Math.max(0, Math.min(1, v)); range.dispatchEvent(new Event('input')); };
  $(`#n-pct-${key}`).oninput = e => { const v = toNum(e.target.value); if (!isNaN(v)) apply(v / 100); };
  $(`#n-eur-${key}`).oninput = e => { const v = toNum(e.target.value); if (!isNaN(v) && base > 0) apply(v / base); };
}

  const focusNewRow = id => {

    const cat = btn.dataset.cat;
    const last = Math.max(-1, ...m.expenses.filter(e => e.category === cat).map(e => Number(e.sort_order) || 0));
    const data = await api('POST', '/api/expenses', {month_id: m.id, category: cat, name:'Novo item', planned:0, account:'S', sort_order: last + 1});
    const idx = S.months.findIndex(x=>x.id===m.id);
    if (idx>=0 && data.month) S.months[idx] = data.month;
    renderMonthTab(); renderDashboard();
    focusNewRow(data.id);
  });

  const addCatBtn = $('#btnAddCat');
  if (addCatBtn) addCatBtn.onclick = async () => {
    const name = prompt('Nome da nova categoria (ex.: CASA)');
    if (!name) return;
    const data = await api('POST', '/api/expenses', {month_id: m.id, category: name.toUpperCase(), name:'Novo item', planned:0, account:'S'});
    const idx = S.months.findIndex(x=>x.id===m.id);
    if (idx>=0 && data.month) S.months[idx] = data.month;
    renderMonthTab(); renderDashboard();
    focusNewRow(data.id);
  };

  const reloadMonthAfterEdit = async () => {
    const fresh = await refreshMonth(m.id);
    S.months[S.currentIdx] = fresh;
    renderMonthTab(); renderDashboard();
  };
  wireSectionSort($('#secSortMonth'));
  wireSectionDrag($('#catListMonth'));
  $$('.cat-group', $('#tab-month')).forEach(group => {
    wireDragReorder(group, '.item-row:not([data-id=fatia])', 'month_expenses', reloadMonthAfterEdit);
    const sortBtn = group.querySelector('.f-sort-cat');
    if (sortBtn) sortBtn.onclick = () => {
      const items = m.expenses.filter(e => e.category === group.dataset.cat);
      sortAlphabetically('month_expenses', items, reloadMonthAfterEdit);
    };
  });
}

// Abaixo de 100% não é erro: o que fica por distribuir vai para o Geral.
function splitValidator(items, base){
  const sum = items.reduce((a,i)=>a+i.pct,0);
  if (Math.abs(sum-1) < 0.0005) return `<span class="pill good">${pct(sum)} do total ✓</span>`;
  if (sum < 1) return `<span class="pill" title="o que fica por distribuir vai para a Poupança Geral">${pct(sum)} · ${base ? eur((1-sum)*base) + ' ' : 'o resto '}vai para o Geral</span>`;
  return `<span class="pill bad">${pct(sum)} do total — passa dos 100%</span>`;
}

/* «0,50 € certos»: ao largar o deslizador ou ao sair da caixa, a % acerta-se para
   que a parte do mês dê um múltiplo exato de 0,50 € (o mais perto). Ligado por
   omissão; desliga-se no cabeçalho dos cofres ou nas Definições. */
const snapOn = () => S.settings.snap_round_pct !== false;
function snapPct(fraction, base){
  if (!snapOn() || !(base > 0)) return fraction;
  return Math.max(0, Math.min(1, Math.round(fraction * base / 0.5) * 0.5 / base));
}
function snapToggle(id){
  return `<button id="${id}" class="snap-toggle${snapOn() ? ' on' : ''}" aria-pressed="${snapOn()}"
    title="acertar cada % para o valor do mês dar 0,50 € certos">0,50 € certos</button>`;
}
function wireSnapToggle(id){
  const b = $('#' + id);
  if (b) b.onclick = async () => {
    S.settings.snap_round_pct = !snapOn();
    renderPotsTab(); renderInvestTab(); renderSettingsTab();
    try { await api('PATCH', '/api/settings', {snap_round_pct: S.settings.snap_round_pct}); } catch (e) {}
  };
}

function pctRow(p){ return `
